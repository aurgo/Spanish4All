<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprendo a leer en español</title>
<meta name="description" content="Aprender a leer español desde cero con la voz del propio navegador.">
<meta name="theme-color" content="#e0632e">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Nunito:wght@600;800&display=swap">
<style>
/*!
 * styles.css — Aprendo a leer en español
 *
 * Criterios de diseño, todos al servicio de un niño de 6-8 años que aún no
 * descifra el español:
 *   - Botones enormes (mínimo 64 px): se usa con el dedo, en tableta.
 *   - Nada esencial depende de leer: color, emoji, icono y voz lo sostienen.
 *   - Tipografía Andika, diseñada para lectores principiantes, en todo lo que
 *     el niño tiene que descifrar. Nunito, más compacta, para el resto.
 *   - Una sola acción evidente por pantalla.
 */

/* ---------------------------------------------------------------- tokens */
:root {
  color-scheme: light;

  --fondo: #fdf8f2;
  --fondo-alto: #f6ecdf;
  --superficie: #ffffff;
  --superficie-2: #fbf5ee;
  --borde: #e8dccd;
  --tinta: #2c2622;
  --tinta-suave: #6d6058;
  --sombra: 0 2px 0 rgba(70, 52, 38, .12), 0 10px 26px rgba(70, 52, 38, .10);
  --sombra-boton: 0 5px 0 var(--boton-borde, #d8c6ae);

  --acento: #e0632e;
  --acento-tinta: #ffffff;
  --exito: #2e9367;
  --exito-suave: #e2f5ec;
  --error: #cf4b3f;
  --error-suave: #fdeae7;
  --estrella: #f0a92c;

  /* Una familia de color por unidad; rota cada 8 unidades. */
  --c0: #e0632e;  --c1: #d9932b;  --c2: #4f9d4a;  --c3: #2f9b8f;
  --c4: #3f7fd0;  --c5: #6a63cf;  --c6: #ab5ac0;  --c7: #d1517f;

  --radio: 20px;
  --radio-s: 14px;
  --ui: 'Nunito', ui-rounded, 'Segoe UI Rounded', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  --lectura: 'Andika', 'Nunito', ui-rounded, system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fondo: #1d1a18;
    --fondo-alto: #262220;
    --superficie: #2a2523;
    --superficie-2: #322c29;
    --borde: #453d38;
    --tinta: #f6efe8;
    --tinta-suave: #b6a89e;
    --sombra: 0 2px 0 rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .35);
    --sombra-boton: 0 5px 0 var(--boton-borde, #14110f);
    --acento: #f0793f;
    --acento-tinta: #241009;
    --exito: #4dbb88;
    --exito-suave: #1e3a2e;
    --error: #ef7365;
    --error-suave: #3d211d;
    --c0: #f0793f;  --c1: #eeae43;  --c2: #6cbf64;  --c3: #45bcae;
    --c4: #5f9df0;  --c5: #8b83ef;  --c6: #c778dc;  --c7: #ee6f9c;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --fondo: #1d1a18;
  --fondo-alto: #262220;
  --superficie: #2a2523;
  --superficie-2: #322c29;
  --borde: #453d38;
  --tinta: #f6efe8;
  --tinta-suave: #b6a89e;
  --sombra: 0 2px 0 rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .35);
  --sombra-boton: 0 5px 0 var(--boton-borde, #14110f);
  --acento: #f0793f;
  --acento-tinta: #241009;
  --exito: #4dbb88;
  --exito-suave: #1e3a2e;
  --error: #ef7365;
  --error-suave: #3d211d;
  --c0: #f0793f;  --c1: #eeae43;  --c2: #6cbf64;  --c3: #45bcae;
  --c4: #5f9df0;  --c5: #8b83ef;  --c6: #c778dc;  --c7: #ee6f9c;
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--ui);
  background: var(--fondo);
  color: var(--tinta);
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}

button { font: inherit; color: inherit; }

.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 16px 40px;
  min-height: 100vh;
  min-height: 100dvh;
}

.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.etq { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2; }

.zh {
  display: block;
  font-size: .78em;
  font-weight: 600;
  opacity: .62;
  margin-top: 2px;
  letter-spacing: .02em;
}

/* --------------------------------------------------------------- botones */
.btn {
  --boton-color: var(--superficie);
  --boton-borde: var(--borde);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 60px;
  padding: 14px 24px;
  border: 2px solid var(--boton-borde);
  border-radius: var(--radio);
  background: var(--boton-color);
  box-shadow: var(--sombra-boton);
  font-weight: 800;
  font-size: 1.05rem;
  cursor: pointer;
  transition: transform .08s ease, filter .15s ease;
  touch-action: manipulation;
  user-select: none;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--boton-borde); }
.btn:focus-visible { outline: 4px solid var(--acento); outline-offset: 3px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.btn-principal {
  --boton-color: var(--acento);
  --boton-borde: color-mix(in srgb, var(--acento) 72%, #000);
  color: var(--acento-tinta);
  font-size: 1.2rem;
  min-height: 68px;
  padding: 16px 34px;
}
.btn-grande { width: 100%; font-size: 1.25rem; min-height: 72px; }
.btn-icono {
  min-height: 56px;
  min-width: 56px;
  padding: 10px;
  border-radius: 50%;
  font-size: 1.4rem;
}
.btn-audio {
  --boton-color: var(--superficie);
  --boton-borde: var(--borde);
  font-size: 1.8rem;
}

/* -------------------------------------------------------------- cabecera */
.barra {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  background: linear-gradient(var(--fondo) 72%, transparent);
}
.barra h1 { flex: 1; margin: 0; font-size: 1.15rem; font-weight: 800; line-height: 1.2; }
.barra .marcador {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 14px; border-radius: 999px;
  background: var(--superficie); border: 2px solid var(--borde);
  font-weight: 800; font-variant-numeric: tabular-nums;
}
.barra .marcador span { color: var(--estrella); }

/* ------------------------------------------------------------------ mapa */
.portada {
  text-align: center;
  padding: 22px 0 10px;
}
.portada .logo { font-size: clamp(3.4rem, 16vw, 5rem); line-height: 1; }
.portada h2 { margin: 8px 0 2px; font-size: clamp(1.6rem, 6vw, 2.2rem); }
.portada p { margin: 0 0 18px; color: var(--tinta-suave); font-weight: 600; }

.progreso-barra {
  height: 16px;
  border-radius: 999px;
  background: var(--fondo-alto);
  border: 2px solid var(--borde);
  overflow: hidden;
  margin: 14px 0 6px;
}
.progreso-barra i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--c2), var(--c3));
  transition: width .5s ease;
}

.acciones-rapidas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 26px; }

.rejilla-unidades {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  gap: 12px;
}
.unidad-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  aspect-ratio: 1;
  padding: 8px;
  border: 3px solid var(--u);
  border-radius: 24px;
  background: var(--superficie);
  box-shadow: 0 5px 0 var(--u);
  cursor: pointer;
  transition: transform .08s ease;
  touch-action: manipulation;
}
.unidad-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--u); }
.unidad-btn .n {
  position: absolute; top: 6px; left: 9px;
  font-size: .7rem; font-weight: 800; color: var(--tinta-suave);
  font-variant-numeric: tabular-nums;
}
.unidad-btn .letra {
  font-family: var(--lectura);
  font-size: 1.9rem;
  font-weight: 700;
  line-height: 1;
  color: var(--u);
  text-align: center;
  word-break: break-word;
}
.unidad-btn .letra.corta { font-size: 2.6rem; }
.unidad-btn .emo { font-size: 1.1rem; }
.unidad-btn .hecha {
  position: absolute; top: -8px; right: -6px;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--exito); color: #fff;
  display: grid; place-items: center; font-size: .95rem;
  border: 3px solid var(--fondo);
}
.unidad-btn[data-bloqueada="1"] { opacity: .42; filter: grayscale(.7); }
.unidad-btn[data-bloqueada="1"] .letra { color: var(--tinta-suave); }
.unidad-btn.sugerida::after {
  content: '';
  position: absolute; inset: -8px;
  border-radius: 30px;
  border: 3px dashed var(--u);
  animation: pulso 1.8s ease-in-out infinite;
}
@keyframes pulso { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }

/* --------------------------------------------------------------- lección */
.enunciado {
  display: flex; align-items: center; gap: 12px;
  background: var(--superficie);
  border: 2px solid var(--borde);
  border-radius: var(--radio);
  padding: 12px 16px;
  margin-bottom: 18px;
  box-shadow: var(--sombra);
}
.enunciado .txt { flex: 1; font-weight: 800; font-size: 1.05rem; }

.pasos { display: flex; gap: 6px; margin: 4px 0 16px; }
.pasos i {
  flex: 1; height: 8px; border-radius: 999px;
  background: var(--fondo-alto); border: 1px solid var(--borde);
}
.pasos i.hecho { background: var(--exito); border-color: var(--exito); }
.pasos i.actual { background: var(--u, var(--acento)); border-color: var(--u, var(--acento)); }

.tarjeta {
  background: var(--superficie);
  border: 3px solid var(--u, var(--borde));
  border-radius: 28px;
  padding: 24px 18px;
  text-align: center;
  box-shadow: var(--sombra);
}

.letra-gigante {
  font-family: var(--lectura);
  font-size: clamp(6rem, 34vw, 12rem);
  font-weight: 700;
  line-height: .95;
  color: var(--u, var(--acento));
  letter-spacing: .04em;
}
.letra-gigante .min { opacity: 1; }
.letra-gigante .may { font-size: .62em; opacity: .4; }

.dato { margin: 6px 0; color: var(--tinta-suave); font-weight: 700; }
.dato b { color: var(--tinta); }
.truco {
  margin: 14px auto 0;
  max-width: 46ch;
  font-size: 1.02rem;
  line-height: 1.5;
  font-weight: 600;
  color: var(--tinta-suave);
}

/* Vocales de la primera unidad */
.vocales-fila { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.vocal-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 96px; padding: 14px 10px;
  border: 3px solid var(--u); border-radius: 22px;
  background: var(--superficie); box-shadow: 0 5px 0 var(--u);
  cursor: pointer; transition: transform .08s ease;
}
.vocal-btn:active, .vocal-btn.sonando { transform: translateY(4px); box-shadow: 0 1px 0 var(--u); }
.vocal-btn .v { font-family: var(--lectura); font-size: 3rem; font-weight: 700; line-height: 1; color: var(--u); }
.vocal-btn .e { font-size: 1.5rem; }
.vocal-btn .p { font-size: .8rem; font-weight: 700; color: var(--tinta-suave); }

/* --------------------------------------------------------------- sílabas */
.rejilla-silabas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
  gap: 12px;
  margin-top: 4px;
}
.silaba {
  position: relative;
  font-family: var(--lectura);
  font-size: clamp(1.9rem, 8vw, 2.6rem);
  font-weight: 700;
  padding: 18px 8px;
  border: 3px solid var(--u, var(--acento));
  border-radius: 22px;
  background: var(--superficie);
  color: var(--u, var(--acento));
  box-shadow: 0 5px 0 var(--u, var(--acento));
  cursor: pointer;
  transition: transform .08s ease, background .2s ease;
  touch-action: manipulation;
}
.silaba:active, .silaba.sonando { transform: translateY(4px); box-shadow: 0 1px 0 var(--u, var(--acento)); }
.silaba.sonando { background: color-mix(in srgb, var(--u, var(--acento)) 16%, var(--superficie)); }
.silaba.tocada::after {
  content: '✓';
  position: absolute; top: 4px; right: 8px;
  font-size: .8rem; font-family: var(--ui); color: var(--exito);
}
.silaba.bien { background: var(--exito-suave); border-color: var(--exito); color: var(--exito); box-shadow: 0 5px 0 var(--exito); }
.silaba.mal { background: var(--error-suave); border-color: var(--error); color: var(--error); box-shadow: 0 5px 0 var(--error); animation: tiembla .35s; }
@keyframes tiembla {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-7px); }
  75% { transform: translateX(7px); }
}

/* -------------------------------------------------------------- palabras */
.palabra-tarjeta {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 18px 14px;
  background: var(--superficie);
  border: 3px solid var(--borde);
  border-radius: 24px;
  box-shadow: var(--sombra);
}
.palabra-emoji { font-size: clamp(3rem, 14vw, 4.4rem); line-height: 1; }

.palabra-silabas { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.trozo {
  font-family: var(--lectura);
  font-size: clamp(1.7rem, 7.5vw, 2.4rem);
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 16px;
  border: 3px solid transparent;
  background: var(--superficie-2);
  color: var(--tinta);
  cursor: pointer;
  transition: transform .08s ease, background .2s ease;
  touch-action: manipulation;
}
.trozo:nth-child(odd) { color: var(--u, var(--acento)); }
.trozo.sonando { background: color-mix(in srgb, var(--u, var(--acento)) 20%, var(--superficie)); transform: translateY(-3px); }
.trozo.tonica { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }

.palabra-entera {
  font-family: var(--lectura);
  font-size: clamp(2rem, 9vw, 3rem);
  font-weight: 700;
  letter-spacing: .01em;
}

.fila-botones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }
.fila-botones .btn { flex: 1 1 auto; min-width: 140px; }

/* ------------------------------------------------------ construir palabra */
.construccion {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  min-height: 88px; align-items: center;
  padding: 14px;
  border: 3px dashed var(--borde);
  border-radius: 22px;
  background: var(--superficie-2);
  margin-bottom: 16px;
}
.construccion:empty::before {
  content: '···';
  font-size: 2rem; color: var(--tinta-suave); letter-spacing: .2em;
}
.hueco {
  font-family: var(--lectura); font-size: 2rem; font-weight: 700;
  padding: 6px 14px; border-radius: 14px;
  background: var(--u, var(--acento)); color: #fff;
}

/* --------------------------------------------------------------- frases */
.frase {
  font-family: var(--lectura);
  font-size: clamp(1.4rem, 5.6vw, 2rem);
  font-weight: 600;
  line-height: 1.9;
  text-align: left;
  padding: 18px;
  background: var(--superficie);
  border: 3px solid var(--borde);
  border-radius: 22px;
  box-shadow: var(--sombra);
  margin-bottom: 14px;
}
.palabra-tocable {
  display: inline-block;
  padding: 2px 4px;
  border-radius: 10px;
  cursor: pointer;
  transition: background .18s ease;
  touch-action: manipulation;
}
.palabra-tocable:hover { background: var(--superficie-2); }
.palabra-tocable.sonando { background: color-mix(in srgb, var(--u, var(--acento)) 26%, var(--superficie)); }
.frase .sil, .salida .sil { padding: 2px 1px; border-radius: 8px; cursor: pointer; }
.frase .sil.sonando, .salida .sil.sonando { background: color-mix(in srgb, var(--u, var(--acento)) 30%, var(--superficie)); }

/* ------------------------------------------------------------- resultado */
.resultado { text-align: center; padding: 28px 12px; }
.resultado .emo { font-size: 5rem; line-height: 1; animation: salta .6s ease; }
@keyframes salta {
  0% { transform: scale(.3) rotate(-12deg); }
  60% { transform: scale(1.15) rotate(6deg); }
  100% { transform: scale(1) rotate(0); }
}
.resultado h2 { margin: 10px 0 4px; font-size: 1.8rem; }
.estrellas-ganadas { font-size: 2.4rem; letter-spacing: .1em; color: var(--estrella); }

/* ---------------------------------------------------------- lector libre */
.lector textarea {
  width: 100%;
  min-height: 130px;
  padding: 16px;
  font-family: var(--lectura);
  font-size: 1.3rem;
  line-height: 1.6;
  border: 3px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
  color: var(--tinta);
  resize: vertical;
}
.lector textarea:focus { outline: none; border-color: var(--acento); }
.salida {
  margin-top: 18px;
  padding: 18px;
  background: var(--superficie);
  border: 3px solid var(--borde);
  border-radius: var(--radio);
  font-family: var(--lectura);
  font-size: clamp(1.4rem, 5.4vw, 1.9rem);
  line-height: 2.1;
  box-shadow: var(--sombra);
}
.salida .pal { display: inline-block; margin: 0 1px; }
.salida .sil {
  display: inline-block;
  border-radius: 8px;
  cursor: pointer;
  touch-action: manipulation;
}
.sil-b { color: var(--u, var(--acento)); }
.salida .sil.sonando { background: color-mix(in srgb, var(--acento) 26%, var(--superficie)); }
.sep { opacity: .38; margin: 0 -1px; }

/* -------------------------------------------------------------- ajustes */
.hoja {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(20, 14, 10, .5);
  backdrop-filter: blur(3px);
}
.hoja-panel {
  width: 100%; max-width: 520px;
  max-height: 88vh; overflow-y: auto;
  padding: 22px 20px 32px;
  background: var(--fondo);
  border-radius: 28px 28px 0 0;
  border-top: 4px solid var(--acento);
  animation: sube .25s ease;
}
@keyframes sube { from { transform: translateY(40px); opacity: .4; } }
.ajuste { padding: 14px 0; border-bottom: 2px solid var(--borde); }
.ajuste:last-child { border-bottom: 0; }
.ajuste label { display: block; font-weight: 800; margin-bottom: 8px; }
.ajuste select, .ajuste input[type="range"] { width: 100%; }
.ajuste select {
  padding: 12px; border-radius: var(--radio-s);
  border: 2px solid var(--borde); background: var(--superficie); color: var(--tinta);
  font-size: 1rem;
}
.ajuste input[type="range"] { height: 40px; accent-color: var(--acento); }
/* Más específico que ".ajuste label { display: block }", que si no gana por
   especificidad y deja la casilla pegada al texto en vez de a la derecha. */
.ajuste label.interruptor,
.interruptor {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
}
.interruptor input { width: 30px; height: 30px; accent-color: var(--acento); }

.aviso {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 14px 16px; margin: 12px 0;
  border-radius: var(--radio-s);
  background: var(--error-suave);
  border: 2px solid var(--error);
  font-weight: 700; font-size: .95rem;
}

/* --------------------------------------------------------------- extras */
.confeti {
  position: fixed; top: -20px; z-index: 90;
  font-size: 1.6rem; pointer-events: none;
  animation: cae linear forwards;
}
@keyframes cae {
  to { transform: translateY(105vh) rotate(540deg); opacity: .1; }
}

.pie { margin-top: 34px; text-align: center; color: var(--tinta-suave); font-size: .85rem; font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

@media (min-width: 620px) {
  .rejilla-unidades { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .barra h1 { font-size: 1.35rem; }
}

/* Modo MAYÚSCULAS: algunos niños arrancan mejor con la letra de imprenta.
   Sólo transforma el texto que hay que descifrar, no la interfaz. */
body[data-may="1"] .silaba,
body[data-may="1"] .trozo,
body[data-may="1"] .hueco,
body[data-may="1"] .palabra-entera,
body[data-may="1"] .letra-gigante,
body[data-may="1"] .frase,
body[data-may="1"] .salida,
body[data-may="1"] .unidad-btn .letra,
body[data-may="1"] .vocal-btn .v { text-transform: uppercase; }

/* ------------------------------------------------ leer en voz alta ------ */

.micro { text-align: center; margin-top: 18px; }

.micro-btn {
  width: 108px;
  height: 108px;
  border-radius: 50%;
  border: 4px solid var(--acento);
  background: var(--superficie);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--acento) 70%, #000);
  cursor: pointer;
  transition: transform .08s ease;
  touch-action: manipulation;
}
.micro-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, var(--acento) 70%, #000); }
.micro-btn:focus-visible { outline: 4px solid var(--acento); outline-offset: 4px; }
.micro-icono { font-size: 3rem; line-height: 1; }

/* Mientras escucha, el botón late: es la señal de que puede hablar. */
.micro-btn.escuchando {
  border-color: var(--error);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--error) 55%, transparent);
  animation: late 1.4s ease-out infinite;
  cursor: default;
}
@keyframes late {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--error) 55%, transparent); }
  70%  { box-shadow: 0 0 0 26px color-mix(in srgb, var(--error) 0%, transparent); }
  100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--error) 0%, transparent); }
}

.micro-pie { margin: 12px 0 4px; font-weight: 800; font-size: 1.05rem; }
.micro-error {
  margin: 12px auto 0; max-width: 40ch;
  color: var(--error); font-weight: 700; font-size: .95rem; line-height: 1.45;
}
.transcripcion {
  min-height: 2em;
  margin: 6px auto 0;
  max-width: 34ch;
  font-family: var(--lectura);
  font-size: 1.3rem;
  color: var(--tinta-suave);
  font-style: italic;
}

.veredicto {
  padding: 18px 16px;
  border-radius: 24px;
  border: 3px solid var(--borde);
  background: var(--superficie);
  box-shadow: var(--sombra);
}
.veredicto.v3 { border-color: var(--exito); background: var(--exito-suave); }
.veredicto.v2, .veredicto.v1 { border-color: var(--estrella); }
.veredicto.v0 { border-color: var(--error); background: var(--error-suave); }

.lectura-marcada {
  font-family: var(--lectura);
  font-size: clamp(1.4rem, 6vw, 2rem);
  font-weight: 700;
  line-height: 1.6;
  margin: 10px 0;
}
/* Verde lo que salió bien, ámbar lo que casi, rojo lo que hay que repasar.
   El subrayado acompaña al color para quien no lo distinga. */
.pal-bien { color: var(--exito); }
.pal-casi {
  color: var(--estrella);
  text-decoration: underline wavy;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
}
.pal-mal {
  color: var(--error);
  text-decoration: underline;
  text-decoration-thickness: 3px;
  text-underline-offset: 5px;
}

.oido {
  margin: 8px 0; font-size: .95rem; font-weight: 700; color: var(--tinta-suave);
}
.comentario {
  margin: 10px auto 0; max-width: 42ch;
  font-size: 1.05rem; font-weight: 700; line-height: 1.5;
}
.sello-modelo { opacity: .8; }

/* Instalación: se numera sólo cuando hay un orden real; los caminos
   alternativos van con viñeta, porque numerarlos sugeriría una secuencia. */
.nota-instalar {
  margin: 0 0 12px; font-weight: 600; line-height: 1.55; color: var(--tinta-suave);
}
.pasos-instalar {
  margin: 0; padding-left: 22px;
  font-weight: 600; line-height: 1.55;
}
.pasos-instalar li { margin-bottom: 10px; }
.pasos-instalar.opciones { list-style: '→  '; }

/* Código para pasar el progreso: pensado para leerlo en voz alta y copiarlo
   a mano, así que va grande, separado y en una tipografía de ancho fijo. */
.codigo {
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  font-size: clamp(1.3rem, 6vw, 1.9rem);
  font-weight: 700;
  letter-spacing: .12em;
  text-align: center;
  padding: 14px 10px;
  margin: 8px 0 14px;
  border: 3px dashed var(--acento);
  border-radius: var(--radio-s);
  background: var(--superficie);
  color: var(--acento);
  user-select: all;          /* un toque lo selecciona entero */
  word-break: break-all;
}
.campo-codigo {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 1.2rem;
  letter-spacing: .08em;
  text-align: center;
  text-transform: uppercase;
  border: 3px solid var(--borde);
  border-radius: var(--radio-s);
  background: var(--superficie);
  color: var(--tinta);
}
.campo-codigo:focus { outline: none; border-color: var(--acento); }

/* ==================================================== nivel avanzado ==== */

/* Falsos amigos: las dos lenguas enfrentadas, para que el contraste se vea
   además de oírse. */
.contraste { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 6px; }
.contraste .btn { flex-direction: column; gap: 4px; min-height: 96px; padding: 12px 8px; }
.contraste .bandera { font-size: 1.6rem; }
.contraste .chico { font-size: .72rem; font-weight: 700; opacity: .7; }
.contraste b { font-family: var(--lectura); font-size: 1.3rem; }
.lado-en { --boton-borde: #6a63cf; }
.lado-es { --boton-borde: var(--acento); }

.aviso-ingles {
  display: flex; gap: 12px; align-items: flex-start; text-align: left;
  margin: 16px auto 0; max-width: 46ch;
  padding: 14px 16px;
  border: 2px dashed var(--c5);
  border-radius: var(--radio-s);
  background: color-mix(in srgb, var(--c5) 8%, var(--superficie));
}
.aviso-ingles p { margin: 0 0 10px; font-weight: 600; font-size: .95rem; line-height: 1.45; }
.aviso-ingles .btn { min-height: 48px; font-size: .95rem; padding: 8px 14px; }

.campo-dictado { text-transform: lowercase; letter-spacing: .04em; margin-top: 14px; }

/* ------------------------------------------------------------ cuentos -- */
.nivel-titulo {
  margin: 22px 0 10px; font-size: 1.05rem; text-transform: uppercase;
  letter-spacing: .08em; color: var(--tinta-suave);
}
.rejilla-cuentos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.cuento-btn {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 16px 10px;
  border: 3px solid var(--u); border-radius: 22px;
  background: var(--superficie); box-shadow: 0 5px 0 var(--u);
  cursor: pointer; transition: transform .08s ease; touch-action: manipulation;
}
.cuento-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--u); }
.cuento-btn.leido { border-color: var(--exito); box-shadow: 0 5px 0 var(--exito); }
.cuento-emo { font-size: 2.4rem; line-height: 1; }
.cuento-titulo { font-weight: 800; text-align: center; line-height: 1.25; }
.cuento-dato { font-size: .78rem; font-weight: 700; color: var(--tinta-suave); }

/* ------------------------------------------------------- comprensión -- */
.pregunta-texto {
  font-family: var(--lectura);
  font-size: clamp(1.2rem, 5vw, 1.6rem);
  font-weight: 700; line-height: 1.5; margin: 10px 0 0;
}
.opciones-pregunta { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
.opcion {
  font-family: var(--lectura);
  font-size: clamp(1.1rem, 4.6vw, 1.4rem);
  font-weight: 600; line-height: 1.4; text-align: left;
  padding: 18px 20px;
  border: 3px solid var(--borde); border-radius: 20px;
  background: var(--superficie); color: var(--tinta);
  box-shadow: 0 4px 0 var(--borde);
  cursor: pointer; transition: transform .08s ease; touch-action: manipulation;
}
.opcion:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--borde); }
.opcion.bien { border-color: var(--exito); background: var(--exito-suave); color: var(--exito); box-shadow: 0 4px 0 var(--exito); }
.opcion.mal { border-color: var(--error); background: var(--error-suave); color: var(--error); box-shadow: 0 4px 0 var(--error); animation: tiembla .35s; }

.moraleja {
  margin-top: 20px; padding: 20px 18px;
  border-radius: 22px;
  border: 3px solid var(--estrella);
  background: color-mix(in srgb, var(--estrella) 12%, var(--superficie));
  text-align: center;
}
.moraleja-icono { font-size: 2.2rem; line-height: 1; }
.moraleja-titulo {
  margin: 6px 0 4px; font-size: .8rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-suave);
}
.moraleja-texto {
  margin: 0; font-family: var(--lectura);
  font-size: clamp(1.1rem, 4.8vw, 1.45rem); font-weight: 700; line-height: 1.5;
}

/* --------------------------------------------------------- velocidad -- */
.marca { margin: 4px 0 12px; }
.ppm-numero {
  display: block; font-size: 3.2rem; font-weight: 800; line-height: 1;
  color: var(--u, var(--acento)); font-variant-numeric: tabular-nums;
}
.ppm-texto { display: block; font-size: .8rem; font-weight: 700; color: var(--tinta-suave); }
.ppm-mejora { display: block; margin-top: 6px; font-weight: 800; color: var(--exito); }

/* ------------------------------------------------- panel del adulto --- */
.cifras { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 6px; }
.cifra {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 12px 4px; border-radius: var(--radio-s);
  background: var(--superficie); border: 2px solid var(--borde);
}
.cifra b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.cifra span { font-size: .68rem; font-weight: 700; color: var(--tinta-suave); text-align: center; line-height: 1.2; }

/* Una barra por lectura: se ve de un vistazo si va ganando velocidad. */
.barras {
  display: flex; align-items: flex-end; gap: 4px;
  height: 84px; margin: 12px 0 6px; padding: 6px;
  border-radius: var(--radio-s); background: var(--superficie-2);
}
.barra-ppm { flex: 1; border-radius: 4px 4px 0 0; background: var(--c3); min-height: 8px; }
.barra-ppm:last-child { background: var(--acento); }

.lista-fallos { margin: 0; padding: 0; list-style: none; }
.lista-fallos li {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--borde);
  font-weight: 700;
}
.lista-fallos li:last-child { border-bottom: 0; }
.lista-fallos b { color: var(--error); font-variant-numeric: tabular-nums; }

/* ================================================ varios niños ========== */

/* Bienvenida: la única pantalla escrita para que la lea un adulto. */
.bienvenida { text-align: center; padding: 24px 0 40px; }
.bienvenida .logo { font-size: clamp(3.4rem, 16vw, 5rem); line-height: 1; }
.bienvenida h1 { margin: 6px 0 10px; font-size: clamp(1.8rem, 7vw, 2.4rem); }
.bienvenida .ajuste { text-align: left; }

.campo-nombre {
  width: 100%;
  padding: 16px;
  font-family: var(--lectura);
  font-size: 1.4rem;
  text-align: center;
  border: 3px solid var(--borde);
  border-radius: var(--radio-s);
  background: var(--superficie);
  color: var(--tinta);
}
.campo-nombre:focus { outline: none; border-color: var(--acento); }

.avatares { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.avatar {
  width: 56px; height: 56px;
  font-size: 1.8rem; line-height: 1;
  border: 3px solid var(--borde); border-radius: 50%;
  background: var(--superficie);
  cursor: pointer; transition: transform .08s ease;
  touch-action: manipulation;
}
.avatar:active { transform: scale(.92); }
.avatar.elegido {
  border-color: var(--acento);
  background: color-mix(in srgb, var(--acento) 16%, var(--superficie));
  transform: scale(1.08);
}

/* Lista de niños del aparato */
.perfil {
  position: relative;
  display: flex; align-items: center; gap: 14px; width: 100%;
  margin-bottom: 10px; padding: 14px 16px;
  border: 3px solid var(--borde); border-radius: var(--radio);
  background: var(--superficie); color: var(--tinta);
  text-align: left; cursor: pointer;
  touch-action: manipulation;
}
.perfil.activo { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 10%, var(--superficie)); }
.perfil-emo { font-size: 2rem; line-height: 1; }
.perfil-datos { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.perfil-datos b { font-size: 1.1rem; }
.perfil-datos span { font-size: .82rem; font-weight: 700; color: var(--tinta-suave); }
.perfil .hecha { position: static; width: 26px; height: 26px; border-width: 0; }

/* La chapa de la esquina: quién está leyendo y cuántas estrellas lleva. */
.marcador-perfil { cursor: pointer; max-width: 58vw; }
.perfil-mini { font-size: 1.15rem; }
.perfil-nombre {
  max-width: 7ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* El chino que acompaña a cada texto. Dentro de un botón cabe al lado; en un
   párrafo baja a su propia línea. */
.btn > .zh { margin-top: 0; font-size: .85em; }
.dato > .zh, .truco > .zh, .comentario > .zh, .micro-error > .zh, .pie > .zh {
  margin-top: 4px;
}
.moraleja-texto.zh { margin-top: 8px; font-size: 1rem; opacity: .75; }
.aviso-ingles .zh { font-weight: 600; }

<body>
<noscript><p style="padding:24px;font-family:system-ui">Esta aplicación necesita JavaScript para poder hablar.</p></noscript>
<main id="app" class="app"></main>
<script>
/* ===== js/syllabify.js ===== */
/*!
 * silabeador.js — División silábica del español.
 *
 * Implementa las reglas ortográficas de la RAE con el detalle suficiente para
 * cubrir el vocabulario infantil y, en general, cualquier palabra en español:
 *
 *   - Dígrafos indivisibles: ch, ll, rr, qu, gu (ante e/i)
 *   - Grupos consonánticos inseparables: bl cl fl gl kl pl / br cr dr fr gr kr pr tr
 *   - Diptongos, triptongos e hiatos (incluida la tilde en vocal débil)
 *   - "y" con valor vocálico a final de sílaba (rey, muy, hoy)
 *   - "ü" como vocal débil (pingüino, cigüeña)
 *   - Repartos de 2, 3 y 4 consonantes intervocálicas (car-ta, ins-tru-men-to, obs-truir)
 *
 * Además calcula la sílaba tónica, que la app usa para resaltarla.
 *
 * Sin dependencias. Funciona como <script> clásico (window.Silabas) y en Node.
 */
(function (root, factory) {
  'use strict';
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Silabas = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var STRONG = 'aeoáéó';
  var WEAK = 'iuü';
  var WEAK_ACCENTED = 'íú';
  var VOWELS = STRONG + WEAK + WEAK_ACCENTED;
  var FRONT = 'eiéí';

  /* Letras que pueden formar parte de una palabra española. */
  var LETTER_RE = /[a-záéíóúüñA-ZÁÉÍÓÚÜÑ]/;

  var L_CLUSTER = { b: 1, c: 1, f: 1, g: 1, k: 1, p: 1 };   // bl, cl, fl, gl, kl, pl (no dl, no tl)
  var R_CLUSTER = { b: 1, c: 1, d: 1, f: 1, g: 1, k: 1, p: 1, t: 1 }; // br, cr, dr, fr, gr, kr, pr, tr

  function isVowel(ch) { return !!ch && VOWELS.indexOf(ch) !== -1; }
  function isStrong(ch) { return STRONG.indexOf(ch) !== -1; }
  function isWeakAccented(ch) { return WEAK_ACCENTED.indexOf(ch) !== -1; }
  function isFront(ch) { return !!ch && FRONT.indexOf(ch) !== -1; }
  function isLetter(ch) { return !!ch && LETTER_RE.test(ch); }

  /* Un par de consonantes que jamás se separa: consonante + l/r. */
  function inseparable(a, b) {
    if (a.length !== 1 || b.length !== 1) return false; // los dígrafos no forman grupo
    if (b === 'l') return L_CLUSTER[a] === 1;
    if (b === 'r') return R_CLUSTER[a] === 1;
    return false;
  }

  /*
   * Divide la palabra en unidades: cada unidad es una vocal o una consonante,
   * donde los dígrafos (ch, ll, rr, qu, gu) cuentan como UNA consonante.
   * Guarda los índices sobre la cadena original para poder reconstruirla con
   * su acentuación y mayúsculas intactas.
   */
  function toUnits(lower) {
    var out = [];
    var i = 0;
    var n = lower.length;
    while (i < n) {
      var c = lower[i], c2 = lower[i + 1], c3 = lower[i + 2];

      if (isVowel(c)) { out.push({ t: 'V', s: i, e: i + 1, v: c }); i += 1; continue; }

      // "y" es vocal (semivocal) cuando cierra sílaba: rey, muy, hoy, y.
      if (c === 'y' && !isVowel(c2)) { out.push({ t: 'V', s: i, e: i + 1, v: 'i' }); i += 1; continue; }

      if (c === 'c' && c2 === 'h') { out.push({ t: 'C', s: i, e: i + 2, v: 'ch' }); i += 2; continue; }
      if (c === 'l' && c2 === 'l') { out.push({ t: 'C', s: i, e: i + 2, v: 'll' }); i += 2; continue; }
      if (c === 'r' && c2 === 'r') { out.push({ t: 'C', s: i, e: i + 2, v: 'rr' }); i += 2; continue; }
      // qu / gu con "u" muda: sólo ante e, i.
      if (c === 'q' && c2 === 'u' && isFront(c3)) { out.push({ t: 'C', s: i, e: i + 2, v: 'qu' }); i += 2; continue; }
      if (c === 'g' && c2 === 'u' && isFront(c3)) { out.push({ t: 'C', s: i, e: i + 2, v: 'gu' }); i += 2; continue; }

      out.push({ t: 'C', s: i, e: i + 1, v: c });
      i += 1;
    }
    return out;
  }

  /* ¿Se unen estas dos vocales en el mismo núcleo (diptongo) o hay hiato? */
  function joinsWith(prev, next) {
    if (isStrong(prev) && isStrong(next)) return false;   // le-ón, te-a-tro
    if (isWeakAccented(next)) return false;               // pa-ís, ba-úl
    if (isWeakAccented(prev)) return false;               // rí-o, dú-o
    return true;                                          // ai, ua, ie, ui...
  }

  /*
   * Agrupa las unidades en núcleos vocálicos con sus consonantes intermedias.
   * Devuelve { onset, nuclei[], codas[] } en forma de lista de sílabas.
   */
  function splitUnits(units) {
    var groups = [];   // núcleos: cada uno es una lista de unidades vocálicas
    var runs = [];     // consonantes previas a cada núcleo
    var pending = [];  // consonantes acumuladas

    var i = 0;
    while (i < units.length) {
      if (units[i].t === 'C') { pending.push(units[i]); i += 1; continue; }

      // Serie de vocales consecutivas → uno o más núcleos.
      var vowels = [];
      while (i < units.length && units[i].t === 'V') { vowels.push(units[i]); i += 1; }

      var j = 0;
      while (j < vowels.length) {
        var nucleus = [vowels[j]];
        j += 1;
        while (
          j < vowels.length &&
          nucleus.length < 3 &&
          joinsWith(nucleus[nucleus.length - 1].v, vowels[j].v)
        ) {
          nucleus.push(vowels[j]);
          j += 1;
        }
        groups.push(nucleus);
        runs.push(pending);
        pending = [];
      }
    }

    return { groups: groups, runs: runs, tail: pending };
  }

  /*
   * Reparte un grupo de consonantes entre la coda de la sílaba anterior y el
   * ataque de la siguiente, según el número de consonantes.
   */
  function shareConsonants(run) {
    var L = run.length;
    if (L === 0) return { coda: [], onset: [] };
    if (L === 1) return { coda: [], onset: run };                       // ca-sa
    if (L === 2) {
      return inseparable(run[0].v, run[1].v)
        ? { coda: [], onset: run }                                      // ha-blar
        : { coda: [run[0]], onset: [run[1]] };                          // car-ta
    }
    if (L === 3) {
      return inseparable(run[1].v, run[2].v)
        ? { coda: [run[0]], onset: [run[1], run[2]] }                   // ins-tru-...
        : { coda: [run[0], run[1]], onset: [run[2]] };                  // cons-tan-te
    }
    // 4 o más: el grupo inseparable final se lleva el ataque.
    return inseparable(run[L - 2].v, run[L - 1].v)
      ? { coda: run.slice(0, L - 2), onset: run.slice(L - 2) }          // obs-truir
      : { coda: run.slice(0, L - 1), onset: run.slice(L - 1) };
  }

  /* Divide UNA palabra (sólo letras) en sílabas. */
  function syllabifyWord(word) {
    if (!word) return [];
    var lower = word.toLowerCase();
    var units = toUnits(lower);
    if (!units.length) return [word];

    var split = splitUnits(units);
    var groups = split.groups;
    if (!groups.length) return [word];   // p. ej. una sigla sin vocales

    // Frontera inicial de cada sílaba, como índice sobre la palabra original.
    var starts = [0];
    for (var k = 1; k < groups.length; k++) {
      var share = shareConsonants(split.runs[k]);
      var start = share.onset.length ? share.onset[0].s : groups[k][0].s;
      starts.push(start);
    }

    var out = [];
    for (var m = 0; m < starts.length; m++) {

  function words(text) {
    return tokenize(text).filter(function (t) { return t.type === 'word'; });

  function palabrasHasta(indice) {
    var out = [];
    for (var i = 0; i <= indice && i < unidades.length; i++) {
      (unidades[i].palabras || []).forEach(function (p) { out.push(p); });

    return out;
  }

  function silabasHasta(indice) {
    var out = [];
    for (var i = 0; i <= indice && i < unidades.length; i++) {
      (unidades[i].silabas || []).forEach(function (s) {
        if (out.indexOf(s) === -1) out.push(s);
      });
    }
    return out;
  }

  function indicePorId(id) {
    for (var i = 0; i < unidades.length; i++) if (unidades[i].id === id) return i;
    return -1;

    'aprendiendo a descifrar las letras. Responde SIEMPRE con una sola frase ' +

/*!
 * pwa.js — Instalar la app en el dispositivo.
 *
 * El objetivo es que el niño tenga un icono en su tableta o en el escritorio
 * y la abra como cualquier otra aplicación, sin acordarse de dónde estaba el
 * archivo. Para eso hace falta un "manifest", y aquí se genera y se enchufa
 * en tiempo de ejecución en vez de vivir en un archivo aparte: así la app
 * sigue cabiendo en un único HTML.
 *
 * Lo que se puede y lo que no (comprobado con Chrome, no supuesto):
 *
 *   ✅ Manifest inyectado desde un blob: — Chrome lo lee sin un solo error,
 *      y la página queda instalable sin service worker.
 *      Requisito: start_url y scope tienen que ser URLs ABSOLUTAS. Si son
 *      relativas se resuelven contra el blob:, que no es una URL válida, y
 *      Chrome las descarta con "property 'start_url' ignored".
 *
 *   ❌ Registrar un service worker desde blob: o data: — prohibido:
 *      "The URL protocol of the script is not supported". Por eso un archivo
 *      suelto no puede funcionar sin conexión desde un servidor: hace falta
 *      un sw.js de verdad al lado (el que genera build.js en docs/).
 *
 *   ❌ Instalar desde file:// — Chrome responde "not-from-secure-origin".
 *      Abierto desde el disco la app funciona entera, pero para INSTALARLA
 *      hay que servirla por https. Ahí sí se puede crear un acceso directo
 *      que la abre en su propia ventana, que es casi lo mismo.
 */
(function (global) {
  'use strict';

  var Iconos = global.Iconos || {};
  var promesaInstalar = null;      // el evento beforeinstallprompt, si llega
  var swListo = false;

  function absoluta(hash) {
    return location.href.split('#')[0] + (hash || '');
  }

  function manifest() {
    var iconos = [];
    if (Iconos.i192) iconos.push({ src: Iconos.i192, sizes: '192x192', type: 'image/png', purpose: 'any' });
    if (Iconos.i512) iconos.push({ src: Iconos.i512, sizes: '512x512', type: 'image/png', purpose: 'any' });
    if (Iconos.iMask) iconos.push({ src: Iconos.iMask, sizes: '512x512', type: 'image/png', purpose: 'maskable' });

    return {
      name: 'Aprendo a leer en español',
      short_name: 'Aprendo a leer',
      description: 'Aprender a leer español desde cero, con la voz y el micrófono del navegador.',
      lang: 'es',
      dir: 'ltr',
      /* Absolutas a propósito: ver la nota de arriba. */
      start_url: absoluta(),
      scope: location.href.replace(/[^/]*(\?.*)?(#.*)?$/, ''),
      display: 'standalone',
      display_override: ['standalone', 'minimal-ui'],
      orientation: 'any',
      background_color: '#fdf8f2',
      theme_color: '#e0632e',
      categories: ['education', 'kids'],
      icons: iconos,
      shortcuts: [{
        name: 'Leer cualquier cosa',
        short_name: 'Leer',
        url: absoluta('#lector'),
        icons: Iconos.i192 ? [{ src: Iconos.i192, sizes: '192x192' }] : undefined
      }]
    };
  }

  function inyectar() {
    if (document.querySelector('link[rel="manifest"]')) return;
    try {
      var texto = JSON.stringify(manifest());
      var url = URL.createObjectURL(new Blob([texto], { type: 'application/manifest+json' }));
      var enlace = document.createElement('link');
      enlace.rel = 'manifest';
      enlace.href = url;
      document.head.appendChild(enlace);
    } catch (e) {}

    /* iOS no usa el manifest: se guía por estas etiquetas. */
    if (Iconos.iApple && !document.querySelector('link[rel="apple-touch-icon"]')) {
      var apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = Iconos.iApple;
      document.head.appendChild(apple);
    }
  }

  /*
   * Si hay un sw.js servido al lado (el paquete de docs/), lo registramos y la
   * app funciona sin conexión. Si no lo hay — el archivo suelto — no pasa nada.
   */
  function registrarSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    var url = new URL('sw.js', location.href).href;
    fetch(url, { method: 'GET' }).then(function (r) {
      if (!r.ok) return;
      var tipo = r.headers.get('content-type') || '';
      if (tipo.indexOf('javascript') === -1) return;
      return navigator.serviceWorker.register(url).then(function () { swListo = true; });
    }).catch(function () { /* sin sw.js al lado: es lo normal en el archivo suelto */ });
  }

  /* ¿Se está ejecutando ya como aplicación instalada? */
  function instalada() {
    try {
      return (global.matchMedia && global.matchMedia('(display-mode: standalone)').matches) ||
             global.navigator.standalone === true;
    } catch (e) { return false; }
  }

  function enMarco() {
    try { return global.self !== global.top; } catch (e) { return true; }
  }

  var ua = (global.navigator && global.navigator.userAgent) || '';
  var esIOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && global.navigator.maxTouchPoints > 1);
  var esFirefox = /Firefox\//.test(ua);

  /*
   * Qué situación tenemos, para decirle a la persona exactamente qué hacer.
   *   nota     explicación en prosa
   *   pasos    instrucciones EN ORDEN (van numeradas)
   *   opciones caminos alternativos (van con viñeta: numerarlos engañaría)
   */
  function situacion() {
    if (instalada()) return { clave: 'ya' };

    if (enMarco()) {
      return {
        clave: 'marco',
        nota: 'Esta página está dentro de otra, y desde ahí el navegador no deja ' +
              'instalar. Ábrela en su propia pestaña y vuelve a pulsar Instalar.'
      };
    }

    if (location.protocol === 'file:') {
      return {
        clave: 'archivo',
        nota: 'Estás abriendo el archivo desde el disco. La app funciona entera así, ' +
              'pero para instalarla el navegador exige que venga de una dirección segura. ' +
              'Tienes dos caminos:',
        opciones: [
          'En el ordenador: menú ⋮ del navegador → Guardar y compartir → Crear acceso ' +
          'directo, y marca «Abrir como ventana». Queda un icono que la abre sola.',
          'En cualquier dispositivo: abre la app desde su enlace https y pulsa Instalar. ' +
          'Así además funciona sin internet.'
        ]
      };
    }

    if (promesaInstalar) return { clave: 'listo' };

    if (esIOS) {
      return {
        clave: 'ios',
        pasos: [
          'Pulsa el botón Compartir de Safari: el cuadrado con la flecha hacia arriba.',
          'Baja por la lista y elige «Añadir a pantalla de inicio».',
          'Pulsa Añadir. El icono aparece con los demás.'
        ]
      };
    }

    if (esFirefox) {
      return {
        clave: 'firefox',
        nota: 'Firefox de escritorio no instala aplicaciones web. Abre esta misma ' +
              'dirección con Chrome, Edge o Safari y podrás instalarla.'
      };
    }

    return {
      clave: 'manual',
      nota: 'Tu navegador todavía no ha ofrecido el botón. Puedes instalarla así:',
      opciones: [
        'Pulsa el icono de instalar de la barra de direcciones: una pantalla con una flecha.',
        'O abre el menú ⋮ y elige «Instalar» o «Añadir a pantalla de inicio».'
      ]
    };
  }

  /* Lanza el diálogo del navegador. Devuelve true si aceptó. */
  function instalar() {
    if (!promesaInstalar) return Promise.resolve(false);
    var evento = promesaInstalar;
    promesaInstalar = null;
    try {
      evento.prompt();
      return Promise.resolve(evento.userChoice).then(function (r) {
        return !!r && r.outcome === 'accepted';
      }).catch(function () { return false; });
    } catch (e) { return Promise.resolve(false); }
  }

  var alCambiar = [];

  global.addEventListener('beforeinstallprompt', function (ev) {
    ev.preventDefault();
    promesaInstalar = ev;
    alCambiar.forEach(function (fn) { try { fn(); } catch (e) {} });
  });

  global.addEventListener('appinstalled', function () {
    promesaInstalar = null;
    alCambiar.forEach(function (fn) { try { fn(); } catch (e) {} });
  });

  inyectar();
  registrarSW();

  global.PWA = {
    instalada: instalada,
    puedeInstalarYa: function () { return !!promesaInstalar; },
    instalar: instalar,
    situacion: situacion,
    sinConexion: function () { return swListo; },
    alCambiar: function (fn) { alCambiar.push(fn); }
  };
})(window);

/*!
 * app.js — Aprendo a leer en español
 *
 * Une el currículo, el silabeador, la voz del navegador y el progreso en una
 * secuencia de actividades que un niño puede recorrer solo.
 *
 * Idea central: el niño no sabe leer español, así que NINGUNA instrucción
 * puede exigir lectura. Cada pantalla se dice en voz alta al entrar, cada
 * enunciado tiene su botón para repetirlo, y todo se apoya en emoji y color.
 *
 * Las actividades van de reconocer a producir:
 *   1. mirar y escuchar la letra      (reconocer)
 *   2. tocar sílabas                  (asociar grafía y sonido)
 *   3. escuchar y elegir la sílaba    (discriminar)
 *   4. leer palabras troceadas        (descifrar)
 *   5. construir la palabra oída      (sintetizar)
 *   6. leer y elegir el dibujo        (leer de verdad, sin pistas de audio)
 *   7. leer en voz alta y comprobarse (producir)
 *   8. frases y textos                (leer de corrido)
 */
