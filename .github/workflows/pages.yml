# Comprobaciones en cada push.
#
# La publicación NO se hace desde aquí: GitHub Pages sirve la rama main
# directamente (Settings → Pages → Deploy from a branch → main / (root)),
# que no depende de ningún token y se actualiza solo en cada push.
#
# Se intentó desplegar desde el workflow con actions/deploy-pages, pero crear
# el sitio por API falla con "Resource not accessible by integration": el
# token no tiene permiso de Pages. Activarlo una vez a mano en Settings sale
# más barato que pelearse con eso.
name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Silabeador, currículo y lectura en voz alta
        run: node src/test/run.js

      - name: El sitio publicado coincide con el código fuente
        run: |
          node src/build.js
          if ! git diff --quiet; then
            echo "La raíz no coincide con src/. Ejecuta 'node src/build.js' y haz commit." >&2
            git diff --stat >&2
            exit 1
          fi
          echo "index.html y aprendo-a-leer.html están al día."
