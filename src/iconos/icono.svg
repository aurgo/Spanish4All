<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icono de la app: la "a" minúscula, que es la primera letra que se
       aprende, sobre el terracota de la interfaz. Los tres puntos son el
       separador de sílabas que el niño ve en toda la app. -->
  <rect width="512" height="512" rx="112" fill="#e0632e"/>
  <text x="256" y="352" font-family="DejaVu Sans, Liberation Sans, sans-serif"
        font-size="330" font-weight="bold" fill="#fdf8f2" text-anchor="middle">a</text>
  <g fill="#fdf8f2" opacity="0.92">
    <circle cx="196" cy="410" r="15"/>
    <circle cx="256" cy="410" r="15"/>
    <circle cx="316" cy="410" r="15"/>
  </g>
</svg>
