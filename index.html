<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprendo a leer en español</title>
<meta name="description" content="Aprender a leer español desde cero con la voz del propio navegador.">
<meta name="theme-color" content="#e0632e">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Nunito:wght@600;800&display=swap">
<style>
/*!
 * styles.css — Aprendo a leer en español
 *
 * Criterios de diseño, todos al servicio de un niño de 6-8 años que aún no
 * descifra el español:
 *   - Botones enormes (mínimo 64 px): se usa con el dedo, en tableta.
 *   - Nada esencial depende de leer: color, emoji, icono y voz lo sostienen.
 *   - Tipografía Andika, diseñada para lectores principiantes, en todo lo que
 *     el niño tiene que descifrar. Nunito, más compacta, para el resto.
 *   - Una sola acción evidente por pantalla.
 */

/* ---------------------------------------------------------------- tokens */
:root {
  color-scheme: light;

  --fondo: #fdf8f2;
  --fondo-alto: #f6ecdf;
  --superficie: #ffffff;
  --superficie-2: #fbf5ee;
  --borde: #e8dccd;
  --tinta: #2c2622;
  --tinta-suave: #6d6058;
  --sombra: 0 2px 0 rgba(70, 52, 38, .12), 0 10px 26px rgba(70, 52, 38, .10);
  --sombra-boton: 0 5px 0 var(--boton-borde, #d8c6ae);

  --acento: #e0632e;
  --acento-tinta: #ffffff;
  --exito: #2e9367;
  --exito-suave: #e2f5ec;
  --error: #cf4b3f;
  --error-suave: #fdeae7;
  --estrella: #f0a92c;

  /* Una familia de color por unidad; rota cada 8 unidades. */
  --c0: #e0632e;  --c1: #d9932b;  --c2: #4f9d4a;  --c3: #2f9b8f;
  --c4: #3f7fd0;  --c5: #6a63cf;  --c6: #ab5ac0;  --c7: #d1517f;

  --radio: 20px;
  --radio-s: 14px;
  --ui: 'Nunito', ui-rounded, 'Segoe UI Rounded', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  --lectura: 'Andika', 'Nunito', ui-rounded, system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fondo: #1d1a18;
    --fondo-alto: #262220;
    --superficie: #2a2523;
    --superficie-2: #322c29;
    --borde: #453d38;
    --tinta: #f6efe8;
    --tinta-suave: #b6a89e;
    --sombra: 0 2px 0 rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .35);
    --sombra-boton: 0 5px 0 var(--boton-borde, #14110f);
    --acento: #f0793f;
    --acento-tinta: #241009;
    --exito: #4dbb88;
    --exito-suave: #1e3a2e;
    --error: #ef7365;
    --error-suave: #3d211d;
    --c0: #f0793f;  --c1: #eeae43;  --c2: #6cbf64;  --c3: #45bcae;
    --c4: #5f9df0;  --c5: #8b83ef;  --c6: #c778dc;  --c7: #ee6f9c;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --fondo: #1d1a18;
  --fondo-alto: #262220;
  --superficie: #2a2523;
  --superficie-2: #322c29;
  --borde: #453d38;
  --tinta: #f6efe8;
  --tinta-suave: #b6a89e;
  --sombra: 0 2px 0 rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .35);
  --sombra-boton: 0 5px 0 var(--boton-borde, #14110f);
  --acento: #f0793f;
  --acento-tinta: #241009;
  --exito: #4dbb88;
  --exito-suave: #1e3a2e;
  --error: #ef7365;
  --error-suave: #3d211d;
  --c0: #f0793f;  --c1: #eeae43;  --c2: #6cbf64;  --c3: #45bcae;
  --c4: #5f9df0;  --c5: #8b83ef;  --c6: #c778dc;  --c7: #ee6f9c;
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--ui);
  background: var(--fondo);
  color: var(--tinta);
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}

button { font: inherit; color: inherit; }

.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 16px 40px;
  min-height: 100vh;
  min-height: 100dvh;
}

.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.etq { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2; }

.zh {
  display: block;
  font-size: .78em;
  font-weight: 600;
  opacity: .62;
  margin-top: 2px;
  letter-spacing: .02em;
}

/* --------------------------------------------------------------- botones */
.btn {
  --boton-color: var(--superficie);
  --boton-borde: var(--borde);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 60px;
  padding: 14px 24px;
  border: 2px solid var(--boton-borde);
  border-radius: var(--radio);
  background: var(--boton-color);
  box-shadow: var(--sombra-boton);
  font-weight: 800;
  font-size: 1.05rem;
  cursor: pointer;
  transition: transform .08s ease, filter .15s ease;
  touch-action: manipulation;
  user-select: none;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--boton-borde); }
.btn:focus-visible { outline: 4px solid var(--acento); outline-offset: 3px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.btn-principal {
  --boton-color: var(--acento);
  --boton-borde: color-mix(in srgb, var(--acento) 72%, #000);
  color: var(--acento-tinta);
  font-size: 1.2rem;
  min-height: 68px;
  padding: 16px 34px;
}
.btn-grande { width: 100%; font-size: 1.25rem; min-height: 72px; }
.btn-icono {
  min-height: 56px;
  min-width: 56px;
  padding: 10px;
  border-radius: 50%;
  font-size: 1.4rem;
}
.btn-audio {
  --boton-color: var(--superficie);
  --boton-borde: var(--borde);
  font-size: 1.8rem;
}

/* -------------------------------------------------------------- cabecera */
.barra {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  background: linear-gradient(var(--fondo) 72%, transparent);
}
.barra h1 { flex: 1; margin: 0; font-size: 1.15rem; font-weight: 800; line-height: 1.2; }
.barra .marcador {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 14px; border-radius: 999px;
  background: var(--superficie); border: 2px solid var(--borde);
  font-weight: 800; font-variant-numeric: tabular-nums;
}
.barra .marcador span { color: var(--estrella); }

/* ------------------------------------------------------------------ mapa */
.portada {
  text-align: center;
  padding: 22px 0 10px;
}
.portada .logo { font-size: clamp(3.4rem, 16vw, 5rem); line-height: 1; }
.portada h2 { margin: 8px 0 2px; font-size: clamp(1.6rem, 6vw, 2.2rem); }
.portada p { margin: 0 0 18px; color: var(--tinta-suave); font-weight: 600; }

.progreso-barra {
  height: 16px;
  border-radius: 999px;
  background: var(--fondo-alto);
  border: 2px solid var(--borde);
  overflow: hidden;
  margin: 14px 0 6px;
}
.progreso-barra i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--c2), var(--c3));
  transition: width .5s ease;
}

.acciones-rapidas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 26px; }

.rejilla-unidades {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  gap: 12px;
}
.unidad-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  aspect-ratio: 1;
  padding: 8px;
  border: 3px solid var(--u);
  border-radius: 24px;
  background: var(--superficie);
  box-shadow: 0 5px 0 var(--u);
  cursor: pointer;
  transition: transform .08s ease;
  touch-action: manipulation;
}
.unidad-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--u); }
.unidad-btn .n {
  position: absolute; top: 6px; left: 9px;
  font-size: .7rem; font-weight: 800; color: var(--tinta-suave);
  font-variant-numeric: tabular-nums;
}
.unidad-btn .letra {
  font-family: var(--lectura);
  font-size: 1.9rem;
  font-weight: 700;
  line-height: 1;
  color: var(--u);
  text-align: center;
  word-break: break-word;
}
.unidad-btn .letra.corta { font-size: 2.6rem; }
.unidad-btn .emo { font-size: 1.1rem; }
.unidad-btn .hecha {
  position: absolute; top: -8px; right: -6px;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--exito); color: #fff;
  display: grid; place-items: center; font-size: .95rem;
  border: 3px solid var(--fondo);
}
.unidad-btn[data-bloqueada="1"] { opacity: .42; filter: grayscale(.7); }
.unidad-btn[data-bloqueada="1"] .letra { color: var(--tinta-suave); }
.unidad-btn.sugerida::after {
  content: '';
  position: absolute; inset: -8px;
  border-radius: 30px;
  border: 3px dashed var(--u);
  animation: pulso 1.8s ease-in-out infinite;
}
@keyframes pulso { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }

/* --------------------------------------------------------------- lección */
.enunciado {
  display: flex; align-items: center; gap: 12px;
  background: var(--superficie);
  border: 2px solid var(--borde);
  border-radius: var(--radio);
  padding: 12px 16px;
  margin-bottom: 18px;
  box-shadow: var(--sombra);
}
.enunciado .txt { flex: 1; font-weight: 800; font-size: 1.05rem; }

.pasos { display: flex; gap: 6px; margin: 4px 0 16px; }
.pasos i {
  flex: 1; height: 8px; border-radius: 999px;
  background: var(--fondo-alto); border: 1px solid var(--borde);
}
.pasos i.hecho { background: var(--exito); border-color: var(--exito); }
.pasos i.actual { background: var(--u, var(--acento)); border-color: var(--u, var(--acento)); }

.tarjeta {
  background: var(--superficie);
  border: 3px solid var(--u, var(--borde));
  border-radius: 28px;
  padding: 24px 18px;
  text-align: center;
  box-shadow: var(--sombra);
}

.letra-gigante {
  font-family: var(--lectura);
  font-size: clamp(6rem, 34vw, 12rem);
  font-weight: 700;
  line-height: .95;
  color: var(--u, var(--acento));
  letter-spacing: .04em;
}
.letra-gigante .min { opacity: 1; }
.letra-gigante .may { font-size: .62em; opacity: .4; }

.dato { margin: 6px 0; color: var(--tinta-suave); font-weight: 700; }
.dato b { color: var(--tinta); }
.truco {
  margin: 14px auto 0;
  max-width: 46ch;
  font-size: 1.02rem;
  line-height: 1.5;
  font-weight: 600;
  color: var(--tinta-suave);
}

/* Vocales de la primera unidad */
.vocales-fila { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.vocal-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 96px; padding: 14px 10px;
  border: 3px solid var(--u); border-radius: 22px;
  background: var(--superficie); box-shadow: 0 5px 0 var(--u);
  cursor: pointer; transition: transform .08s ease;
}
.vocal-btn:active, .vocal-btn.sonando { transform: translateY(4px); box-shadow: 0 1px 0 var(--u); }
.vocal-btn .v { font-family: var(--lectura); font-size: 3rem; font-weight: 700; line-height: 1; color: var(--u); }
.vocal-btn .e { font-size: 1.5rem; }
.vocal-btn .p { font-size: .8rem; font-weight: 700; color: var(--tinta-suave); }

/* --------------------------------------------------------------- sílabas */
.rejilla-silabas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
  gap: 12px;
  margin-top: 4px;
}
.silaba {
  position: relative;
  font-family: var(--lectura);
  font-size: clamp(1.9rem, 8vw, 2.6rem);
  font-weight: 700;
  padding: 18px 8px;
  border: 3px solid var(--u, var(--acento));
  border-radius: 22px;
  background: var(--superficie);
  color: var(--u, var(--acento));
  box-shadow: 0 5px 0 var(--u, var(--acento));
  cursor: pointer;
  transition: transform .08s ease, background .2s ease;
  touch-action: manipulation;
}
.silaba:active, .silaba.sonando { transform: translateY(4px); box-shadow: 0 1px 0 var(--u, var(--acento)); }
.silaba.sonando { background: color-mix(in srgb, var(--u, var(--acento)) 16%, var(--superficie)); }
.silaba.tocada::after {
  content: '✓';
  position: absolute; top: 4px; right: 8px;
  font-size: .8rem; font-family: var(--ui); color: var(--exito);
}
.silaba.bien { background: var(--exito-suave); border-color: var(--exito); color: var(--exito); box-shadow: 0 5px 0 var(--exito); }
.silaba.mal { background: var(--error-suave); border-color: var(--error); color: var(--error); box-shadow: 0 5px 0 var(--error); animation: tiembla .35s; }
@keyframes tiembla {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-7px); }
  75% { transform: translateX(7px); }
}

/* -------------------------------------------------------------- palabras */
.palabra-tarjeta {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 18px 14px;
  background: var(--superficie);
  border: 3px solid var(--borde);
  border-radius: 24px;
  box-shadow: var(--sombra);
}
.palabra-emoji { font-size: clamp(3rem, 14vw, 4.4rem); line-height: 1; }

.palabra-silabas { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.trozo {
  font-family: var(--lectura);
  font-size: clamp(1.7rem, 7.5vw, 2.4rem);
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 16px;
  border: 3px solid transparent;
  background: var(--superficie-2);
  color: var(--tinta);
  cursor: pointer;
  transition: transform .08s ease, background .2s ease;
  touch-action: manipulation;
}
.trozo:nth-child(odd) { color: var(--u, var(--acento)); }
.trozo.sonando { background: color-mix(in srgb, var(--u, var(--acento)) 20%, var(--superficie)); transform: translateY(-3px); }
.trozo.tonica { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }

.palabra-entera {
  font-family: var(--lectura);
  font-size: clamp(2rem, 9vw, 3rem);
  font-weight: 700;
  letter-spacing: .01em;
}

.fila-botones { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }
.fila-botones .btn { flex: 1 1 auto; min-width: 140px; }

/* ------------------------------------------------------ construir palabra */
.construccion {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  min-height: 88px; align-items: center;
  padding: 14px;
  border: 3px dashed var(--borde);
  border-radius: 22px;
  background: var(--superficie-2);
  margin-bottom: 16px;
}
.construccion:empty::before {
  content: '···';
  font-size: 2rem; color: var(--tinta-suave); letter-spacing: .2em;
}
.hueco {
  font-family: var(--lectura); font-size: 2rem; font-weight: 700;
  padding: 6px 14px; border-radius: 14px;
  background: var(--u, var(--acento)); color: #fff;
}

/* --------------------------------------------------------------- frases */
.frase {
  font-family: var(--lectura);
  font-size: clamp(1.4rem, 5.6vw, 2rem);
  font-weight: 600;
  line-height: 1.9;
  text-align: left;
  padding: 18px;
  background: var(--superficie);
  border: 3px solid var(--borde);
  border-radius: 22px;
  box-shadow: var(--sombra);
  margin-bottom: 14px;
}
.palabra-tocable {
  display: inline-block;
  padding: 2px 4px;
  border-radius: 10px;
  cursor: pointer;
  transition: background .18s ease;
  touch-action: manipulation;
}
.palabra-tocable:hover { background: var(--superficie-2); }
.palabra-tocable.sonando { background: color-mix(in srgb, var(--u, var(--acento)) 26%, var(--superficie)); }
.frase .sil, .salida .sil { padding: 2px 1px; border-radius: 8px; cursor: pointer; }
.frase .sil.sonando, .salida .sil.sonando { background: color-mix(in srgb, var(--u, var(--acento)) 30%, var(--superficie)); }

/* ------------------------------------------------------------- resultado */
.resultado { text-align: center; padding: 28px 12px; }
.resultado .emo { font-size: 5rem; line-height: 1; animation: salta .6s ease; }
@keyframes salta {
  0% { transform: scale(.3) rotate(-12deg); }
  60% { transform: scale(1.15) rotate(6deg); }
  100% { transform: scale(1) rotate(0); }
}
.resultado h2 { margin: 10px 0 4px; font-size: 1.8rem; }
.estrellas-ganadas { font-size: 2.4rem; letter-spacing: .1em; color: var(--estrella); }

/* ---------------------------------------------------------- lector libre */
.lector textarea {
  width: 100%;
  min-height: 130px;
  padding: 16px;
  font-family: var(--lectura);
  font-size: 1.3rem;
  line-height: 1.6;
  border: 3px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
  color: var(--tinta);
  resize: vertical;
}
.lector textarea:focus { outline: none; border-color: var(--acento); }
.salida {
  margin-top: 18px;
  padding: 18px;
  background: var(--superficie);
  border: 3px solid var(--borde);
  border-radius: var(--radio);
  font-family: var(--lectura);
  font-size: clamp(1.4rem, 5.4vw, 1.9rem);
  line-height: 2.1;
  box-shadow: var(--sombra);
}
.salida .pal { display: inline-block; margin: 0 1px; }
.salida .sil {
  display: inline-block;
  border-radius: 8px;
  cursor: pointer;
  touch-action: manipulation;
}
.sil-b { color: var(--u, var(--acento)); }
.salida .sil.sonando { background: color-mix(in srgb, var(--acento) 26%, var(--superficie)); }
.sep { opacity: .38; margin: 0 -1px; }

/* -------------------------------------------------------------- ajustes */
.hoja {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(20, 14, 10, .5);
  backdrop-filter: blur(3px);
}
.hoja-panel {
  width: 100%; max-width: 520px;
  max-height: 88vh; overflow-y: auto;
  padding: 22px 20px 32px;
  background: var(--fondo);
  border-radius: 28px 28px 0 0;
  border-top: 4px solid var(--acento);
  animation: sube .25s ease;
}
@keyframes sube { from { transform: translateY(40px); opacity: .4; } }
.ajuste { padding: 14px 0; border-bottom: 2px solid var(--borde); }
.ajuste:last-child { border-bottom: 0; }
.ajuste label { display: block; font-weight: 800; margin-bottom: 8px; }
.ajuste select, .ajuste input[type="range"] { width: 100%; }
.ajuste select {
  padding: 12px; border-radius: var(--radio-s);
  border: 2px solid var(--borde); background: var(--superficie); color: var(--tinta);
  font-size: 1rem;
}
.ajuste input[type="range"] { height: 40px; accent-color: var(--acento); }
.interruptor { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.interruptor input { width: 30px; height: 30px; accent-color: var(--acento); }

.aviso {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 14px 16px; margin: 12px 0;
  border-radius: var(--radio-s);
  background: var(--error-suave);
  border: 2px solid var(--error);
  font-weight: 700; font-size: .95rem;
}

/* --------------------------------------------------------------- extras */
.confeti {
  position: fixed; top: -20px; z-index: 90;
  font-size: 1.6rem; pointer-events: none;
  animation: cae linear forwards;
}
@keyframes cae {
  to { transform: translateY(105vh) rotate(540deg); opacity: .1; }
}

.pie { margin-top: 34px; text-align: center; color: var(--tinta-suave); font-size: .85rem; font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

@media (min-width: 620px) {
  .rejilla-unidades { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .barra h1 { font-size: 1.35rem; }
}

/* Modo MAYÚSCULAS: algunos niños arrancan mejor con la letra de imprenta.
   Sólo transforma el texto que hay que descifrar, no la interfaz. */
body[data-may="1"] .silaba,
body[data-may="1"] .trozo,
body[data-may="1"] .hueco,
body[data-may="1"] .palabra-entera,

.micro { text-align: center; margin-top: 18px; }

.micro-btn {
  width: 108px;
  height: 108px;
  border-radius: 50%;
  border: 4px solid var(--acento);
  background: var(--superficie);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--acento) 70%, #000);
  cursor: pointer;
  transition: transform .08s ease;
  touch-action: manipulation;
}
.micro-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, var(--acento) 70%, #000); }
.micro-btn:focus-visible { outline: 4px solid var(--acento); outline-offset: 4px; }
.micro-icono { font-size: 3rem; line-height: 1; }

/* Mientras escucha, el botón late: es la señal de que puede hablar. */
.micro-btn.escuchando {
  border-color: var(--error);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--error) 55%, transparent);
  animation: late 1.4s ease-out infinite;
  cursor: default;
}
@keyframes late {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--error) 55%, transparent); }
  70%  { box-shadow: 0 0 0 26px color-mix(in srgb, var(--error) 0%, transparent); }
  100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--error) 0%, transparent); }
}

.micro-pie { margin: 12px 0 4px; font-weight: 800; font-size: 1.05rem; }
.micro-error {
  margin: 12px auto 0; max-width: 40ch;
  color: var(--error); font-weight: 700; font-size: .95rem; line-height: 1.45;
}
.transcripcion {
  min-height: 2em;
  margin: 6px auto 0;
  max-width: 34ch;
  font-family: var(--lectura);
  font-size: 1.3rem;
  color: var(--tinta-suave);
  font-style: italic;
}

.veredicto {
  padding: 18px 16px;
  border-radius: 24px;
  border: 3px solid var(--borde);
  background: var(--superficie);
  box-shadow: var(--sombra);
}
.veredicto.v3 { border-color: var(--exito); background: var(--exito-suave); }
.veredicto.v2, .veredicto.v1 { border-color: var(--estrella); }
.veredicto.v0 { border-color: var(--error); background: var(--error-suave); }

.lectura-marcada {
  font-family: var(--lectura);
  font-size: clamp(1.4rem, 6vw, 2rem);
  font-weight: 700;
  line-height: 1.6;
  margin: 10px 0;
}
/* Verde lo que salió bien, ámbar lo que casi, rojo lo que hay que repasar.

.pal-bien { color: var(--exito); }
.pal-casi {
  color: var(--estrella);
  text-decoration: underline wavy;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
}
.pal-mal {
  color: var(--error);
  text-decoration: underline;
  text-decoration-thickness: 3px;
  text-underline-offset: 5px;
}

.oido {
  margin: 8px 0; font-size: .95rem; font-weight: 700; color: var(--tinta-suave);
}
.comentario {
  margin: 10px auto 0; max-width: 42ch;
  font-size: 1.05rem; font-weight: 700; line-height: 1.5;
}
.sello-modelo { opacity: .8; }

}
.pasos-instalar li { margin-bottom: 10px; }

/*!
 * silabeador.js — División silábica del español.

 *   - "ü" como vocal débil (pingüino, cigüeña)

 * Sin dependencias. Funciona como <script> clásico (window.Silabas) y en Node.

  function toUnits(lower) {

      if (isVowel(c)) { out.push({ t: 'V', s: i, e: i + 1, v: c }); i += 1; continue; }

      if (c === 'y' && !isVowel(c2)) { out.push({ t: 'V', s: i, e: i + 1, v: 'i' }); i += 1; continue; }

      if (c === 'c' && c2 === 'h') { out.push({ t: 'C', s: i, e: i + 2, v: 'ch' }); i += 2; continue; }
      if (c === 'l' && c2 === 'l') { out.push({ t: 'C', s: i, e: i + 2, v: 'll' }); i += 2; continue; }
      if (c === 'r' && c2 === 'r') { out.push({ t: 'C', s: i, e: i + 2, v: 'rr' }); i += 2; continue; }
      // qu / gu con "u" muda: sólo ante e, i.
      if (c === 'q' && c2 === 'u' && isFront(c3)) { out.push({ t: 'C', s: i, e: i + 2, v: 'qu' }); i += 2; continue; }
      if (c === 'g' && c2 === 'u' && isFront(c3)) { out.push({ t: 'C', s: i, e: i + 2, v: 'gu' }); i += 2; continue; }

    var pending = [];  // consonantes acumuladas

    }

        ? { coda: [run[0]], onset: [run[1], run[2]] }                   // ins-tru-...

   * Índice de la sílaba tónica.
   *   - Con tilde: la sílaba que la lleva.
   *   - Sin tilde y acabada en vocal, -n o -s: penúltima (llana).
   *   - En los demás casos: última (aguda).

  function stressIndex(syllables) {

  /* Todas las palabras vistas hasta una unidad (para los repasos). */
  function palabrasHasta(indice) {
    var out = [];
    for (var i = 0; i <= indice && i < unidades.length; i++) {
      (unidades[i].palabras || []).forEach(function (p) { out.push(p); });
    }
    return out;
  }

  function silabasHasta(indice) {
    var out = [];
    for (var i = 0; i <= indice && i < unidades.length; i++) {
      (unidades[i].silabas || []).forEach(function (s) {
        if (out.indexOf(s) === -1) out.push(s);
      });
    }
    return out;
  }

  function indicePorId(id) {
    for (var i = 0; i < unidades.length; i++) if (unidades[i].id === id) return i;
    return -1;
  }

  global.Curriculo = {
    unidades: unidades,
    palabrasHasta: palabrasHasta,
    silabasHasta: silabasHasta,
    indicePorId: indicePorId,
    total: unidades.length
  };

/* ===== js/progress.js ===== */
/*!
 * progreso.js — Guarda en el navegador lo que el niño ya ha aprendido.
 *
 * Todo vive en localStorage: no hay servidor, ni cuentas, ni datos que salgan
 * del dispositivo. Si el navegador bloquea el almacenamiento, la app sigue
 * funcionando en memoria durante la sesión.
 */
(function (global) {
  'use strict';

  var CLAVE = 'lectura-es-v1';
  var memoria = null;

  function vacio() {
    return {
      version: 1,
      unidades: {},          // id -> { pasos: {nombre: true}, estrellas: n, completa: bool }
      estrellas: 0,
      ajustes: {
        velocidad: 0.85,
        voz: null,
        chino: false,
        desbloquearTodo: false,
        mayusculas: false,
        micro: true
      },
      ultimaUnidad: null,
      creado: Date.now()
    };
  }

  function leer() {
    if (memoria) return memoria;
    try {
      var raw = global.localStorage.getItem(CLAVE);
      memoria = raw ? JSON.parse(raw) : vacio();
    } catch (e) {
      memoria = vacio();
    }
    if (!memoria || memoria.version !== 1) memoria = vacio();
    if (!memoria.ajustes) memoria.ajustes = vacio().ajustes;
    return memoria;
  }

  function guardar() {
    try { global.localStorage.setItem(CLAVE, JSON.stringify(leer())); } catch (e) {}
  }

  function unidad(id) {
    var d = leer();
    if (!d.unidades[id]) d.unidades[id] = { pasos: {}, estrellas: 0, completa: false };
    return d.unidades[id];
  }

  /* Marca un paso (actividad) como superado y suma estrellas. */
  function completarPaso(idUnidad, paso, estrellas) {
    var u = unidad(idUnidad);
    var nuevo = !u.pasos[paso];
    u.pasos[paso] = true;
    if (nuevo) {
      var s = Math.max(1, estrellas || 1);
      u.estrellas += s;
      leer().estrellas += s;
    }
    leer().ultimaUnidad = idUnidad;
    guardar();
    return nuevo;
  }

  function pasoHecho(idUnidad, paso) {
    return !!unidad(idUnidad).pasos[paso];
  }

  function completarUnidad(idUnidad) {
    var u = unidad(idUnidad);
    var nuevo = !u.completa;
    u.completa = true;
    guardar();
    return nuevo;
  }

  function unidadCompleta(idUnidad) {
    return !!unidad(idUnidad).completa;
  }

  /*
   * Una unidad está disponible si es la primera, si ya se ha empezado, si la
   * anterior está completa, o si el adulto ha desbloqueado todo.
   */
  function disponible(indice, unidades) {
    if (indice === 0) return true;
    if (leer().ajustes.desbloquearTodo) return true;
    var u = unidad(unidades[indice].id);
    if (u.completa || Object.keys(u.pasos).length) return true;
    return unidadCompleta(unidades[indice - 1].id);
  }

  /* Primera unidad sin terminar: es la que la app propone al abrirse. */
  function siguienteUnidad(unidades) {
    for (var i = 0; i < unidades.length; i++) {
      if (!unidadCompleta(unidades[i].id)) return i;
    }
    return unidades.length - 1;
  }

  function ajuste(clave, valor) {
    var d = leer();
    if (arguments.length > 1) { d.ajustes[clave] = valor; guardar(); }
    return d.ajustes[clave];
  }

  function reiniciar() {

/*!
 * pwa.js — Instalar la app en el dispositivo.
 *
 * El objetivo es que el niño tenga un icono en su tableta o en el escritorio
 * y la abra como cualquier otra aplicación, sin acordarse de dónde estaba el
 * archivo. Para eso hace falta un "manifest", y aquí se genera y se enchufa
 * en tiempo de ejecución en vez de vivir en un archivo aparte: así la app
 * sigue cabiendo en un único HTML.
 *
 * Lo que se puede y lo que no (comprobado con Chrome, no supuesto):
 *
 *   ✅ Manifest inyectado desde un blob: — Chrome lo lee sin un solo error,
 *      y la página queda instalable sin service worker.
 *      Requisito: start_url y scope tienen que ser URLs ABSOLUTAS. Si son
 *      relativas se resuelven contra el blob:, que no es una URL válida, y
 *      Chrome las descarta con "property 'start_url' ignored".
 *
 *   ❌ Registrar un service worker desde blob: o data: — prohibido:
 *      "The URL protocol of the script is not supported". Por eso un archivo
 *      suelto no puede funcionar sin conexión desde un servidor: hace falta
 *      un sw.js de verdad al lado (el que genera build.js en docs/).
 *
 *   ❌ Instalar desde file:// — Chrome responde "not-from-secure-origin".
 *      Abierto desde el disco la app funciona entera, pero para INSTALARLA
 *      hay que servirla por https. Ahí sí se puede crear un acceso directo
 *      que la abre en su propia ventana, que es casi lo mismo.
 */
(function (global) {
  'use strict';

  var Iconos = global.Iconos || {};
  var promesaInstalar = null;      // el evento beforeinstallprompt, si llega
  var swListo = false;

  function absoluta(hash) {
    return location.href.split('#')[0] + (hash || '');
  }

  function manifest() {
    var iconos = [];
    if (Iconos.i192) iconos.push({ src: Iconos.i192, sizes: '192x192', type: 'image/png', purpose: 'any' });
    if (Iconos.i512) iconos.push({ src: Iconos.i512, sizes: '512x512', type: 'image/png', purpose: 'any' });
    if (Iconos.iMask) iconos.push({ src: Iconos.iMask, sizes: '512x512', type: 'image/png', purpose: 'maskable' });

    return {
      name: 'Aprendo a leer en español',
      short_name: 'Aprendo a leer',
      description: 'Aprender a leer español desde cero, con la voz y el micrófono del navegador.',
      lang: 'es',
      dir: 'ltr',
      /* Absolutas a propósito: ver la nota de arriba. */
      start_url: absoluta(),
      scope: location.href.replace(/[^/]*(\?.*)?(#.*)?$/, ''),
      display: 'standalone',
      display_override: ['standalone', 'minimal-ui'],
      orientation: 'any',
      background_color: '#fdf8f2',
      theme_color: '#e0632e',
      categories: ['education', 'kids'],
      icons: iconos,
      shortcuts: [{
        name: 'Leer cualquier cosa',
        short_name: 'Leer',
        url: absoluta('#lector'),
        icons: Iconos.i192 ? [{ src: Iconos.i192, sizes: '192x192' }] : undefined
      }]
    };
  }

  function inyectar() {
    if (document.querySelector('link[rel="manifest"]')) return;
    try {
      var texto = JSON.stringify(manifest());
      var url = URL.createObjectURL(new Blob([texto], { type: 'application/manifest+json' }));
      var enlace = document.createElement('link');
      enlace.rel = 'manifest';
      enlace.href = url;
      document.head.appendChild(enlace);
    } catch (e) {}

    /* iOS no usa el manifest: se guía por estas etiquetas. */
    if (Iconos.iApple && !document.querySelector('link[rel="apple-touch-icon"]')) {
      var apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = Iconos.iApple;
      document.head.appendChild(apple);
    }
  }

  /*
   * Si hay un sw.js servido al lado (el paquete de docs/), lo registramos y la
   * app funciona sin conexión. Si no lo hay — el archivo suelto — no pasa nada.
   */
  function registrarSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    var url = new URL('sw.js', location.href).href;
    fetch(url, { method: 'GET' }).then(function (r) {
      if (!r.ok) return;
      var tipo = r.headers.get('content-type') || '';
      if (tipo.indexOf('javascript') === -1) return;
      return navigator.serviceWorker.register(url).then(function () { swListo = true; });
    }).catch(function () { /* sin sw.js al lado: es lo normal en el archivo suelto */ });
  }

  /* ¿Se está ejecutando ya como aplicación instalada? */
  function instalada() {
    try {
      return (global.matchMedia && global.matchMedia('(display-mode: standalone)').matches) ||
             global.navigator.standalone === true;
    } catch (e) { return false; }
  }

  function enMarco() {
    try { return global.self !== global.top; } catch (e) { return true; }
  }

  var ua = (global.navigator && global.navigator.userAgent) || '';
  var esIOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && global.navigator.maxTouchPoints > 1);
  var esFirefox = /Firefox\//.test(ua);

  /*
   * Qué situación tenemos, para decirle a la persona exactamente qué hacer.
   *   nota     explicación en prosa
   *   pasos    instrucciones EN ORDEN (van numeradas)
   *   opciones caminos alternativos (van con viñeta: numerarlos engañaría)
   */
  function situacion() {
    if (instalada()) return { clave: 'ya' };

    if (enMarco()) {
      return {
        clave: 'marco',
        nota: 'Esta página está dentro de otra, y desde ahí el navegador no deja ' +
              'instalar. Ábrela en su propia pestaña y vuelve a pulsar Instalar.'
      };
    }

    if (location.protocol === 'file:') {
      return {
        clave: 'archivo',
        nota: 'Estás abriendo el archivo desde el disco. La app funciona entera así, ' +
              'pero para instalarla el navegador exige que venga de una dirección segura. ' +
              'Tienes dos caminos:',
        opciones: [
          'En el ordenador: menú ⋮ del navegador → Guardar y compartir → Crear acceso ' +
          'directo, y marca «Abrir como ventana». Queda un icono que la abre sola.',
          'En cualquier dispositivo: abre la app desde su enlace https y pulsa Instalar. ' +
          'Así además funciona sin internet.'
        ]
      };
    }

    if (promesaInstalar) return { clave: 'listo' };

    if (esIOS) {
      return {
        clave: 'ios',
        pasos: [
          'Pulsa el botón Compartir de Safari: el cuadrado con la flecha hacia arriba.',
          'Baja por la lista y elige «Añadir a pantalla de inicio».',
          'Pulsa Añadir. El icono aparece con los demás.'
        ]
      };
    }

    if (esFirefox) {
      return {
        clave: 'firefox',
        nota: 'Firefox de escritorio no instala aplicaciones web. Abre esta misma ' +
              'dirección con Chrome, Edge o Safari y podrás instalarla.'
      };
    }

    return {
      clave: 'manual',
      nota: 'Tu navegador todavía no ha ofrecido el botón. Puedes instalarla así:',
      opciones: [
        'Pulsa el icono de instalar de la barra de direcciones: una pantalla con una flecha.',
        'O abre el menú ⋮ y elige «Instalar» o «Añadir a pantalla de inicio».'
      ]
    };
  }

  /* Lanza el diálogo del navegador. Devuelve true si aceptó. */
  function instalar() {
    if (!promesaInstalar) return Promise.resolve(false);
    var evento = promesaInstalar;
    promesaInstalar = null;

 *

 *   2. tocar sílabas                  (asociar grafía y sonido)
 *   3. escuchar y elegir la sílaba    (discriminar)
 *   4. leer palabras troceadas        (descifrar)
 *   5. construir la palabra oída      (sintetizar)
 *   6. leer y elegir el dibujo        (leer de verdad, sin pistas de audio)

    var propias = u.silabas.slice();
    var previas = Curriculo.silabasHasta(Math.max(0, leccion.indice - 1));
    var rondas = Math.min(5, propias.length);
    var orden = mezclar(propias).slice(0, rondas);
    var i = 0;

    function ronda() {
      if (i >= orden.length) return siguientePaso();
      var objetivo = orden[i];
      var otras = tomar(propias, 3, [objetivo]);
      while (otras.length < 3 && previas.length) {
        var extra = tomar(previas, 1, [objetivo].concat(otras))[0];
        if (!extra) break;
        otras.push(extra);
      }
      var opciones = mezclar([objetivo].concat(otras));

      var rejilla = el('div', { class: 'rejilla-silabas' });
      opciones.forEach(function (s) {
        var b = el('button', { class: 'silaba', text: s });
        b.addEventListener('click', function () {
          if (s === objetivo) {
            b.classList.add('bien');
            decir('¡Muy bien! ' + objetivo, 'frase');
            i++;
            setTimeout(ronda, 1100);
          } else {
            b.classList.add('mal');
            setTimeout(function () { b.classList.remove('mal'); }, 500);
            Voz.secuencia([
              { text: 'No. Escucha otra vez', tipo: 'frase', pausa: 300 },
              { text: objetivo, tipo: 'silaba' }
            ]);
          }
        });
        rejilla.appendChild(b);
      });

      marco([
        el('div', { class: 'tarjeta' }, [
          el('button', {
            class: 'btn btn-principal btn-grande',
            text: '🔊 ' + T.t('escuchar'),
            onclick: function () { decir(objetivo, 'silaba'); }
          }),
          el('p', { class: 'dato', text: (i + 1) + ' / ' + orden.length })
        ]),
        rejilla
      ], 'pasoQuizSilaba', null, function () { decir(objetivo, 'silaba'); });
    }
    ronda();
  }

  /* --- 3b. ¿Por qué vocal empieza? (sólo unidad de vocales) ------------ */

  function pasoVocalInicial() {
    var u = leccion.unidad;
    var orden = mezclar(u.vocales.slice());
    var i = 0;

    function ronda() {
      if (i >= orden.length) return siguientePaso();
      var v = orden[i];
      var opciones = mezclar(u.vocales.slice());

      var rejilla = el('div', { class: 'rejilla-silabas' });
      opciones.forEach(function (o) {
        var b = el('button', { class: 'silaba', text: o.letra });
        b.addEventListener('click', function () {
          if (o.letra === v.letra) {
            b.classList.add('bien');
            decir('¡Sí! ' + v.palabra + ' empieza por ' + v.letra, 'frase');
            i++;
            setTimeout(ronda, 1600);
          } else {
            b.classList.add('mal');
            setTimeout(function () { b.classList.remove('mal'); }, 500);
            decir(v.palabra, 'palabra');
          }
        });
        rejilla.appendChild(b);
      });

      marco([
        el('div', { class: 'tarjeta' }, [
          el('div', { class: 'palabra-emoji', text: v.emoji }),
          el('button', {
            class: 'btn btn-principal',
            text: '🔊 ' + v.palabra,
            onclick: function () { decir(v.palabra, 'palabra'); }
          })
        ]),
        rejilla
      ], 'pasoQuizSilaba', 'Toca la vocal por la que empieza el dibujo',
         function () { decir(v.palabra, 'palabra'); });
    }
    ronda();
  }

  /* --- 4. Leer las palabras ------------------------------------------- */

  function pasoPalabras() {
    var u = leccion.unidad;
    var lista = u.palabras.slice(0, 8);
    var i = 0;

    function ver() {
      if (i >= lista.length) return siguientePaso();
      var palabra = lista[i][0];
      var emoji = lista[i][1];
      var trozos = Silabas.syllabify(palabra);
      var tonica = Silabas.stressIndex(trozos);

      var fila = el('div', { class: 'palabra-silabas' });
      var nodos = [];
      trozos.forEach(function (s, k) {
        var b = el('button', { class: 'trozo' + (k === tonica ? ' tonica' : ''), text: s });
        b.addEventListener('click', function () { resaltar(b, decir(s, 'silaba')); });
        nodos.push(b);
        fila.appendChild(b);
      });

      var entera = el('button', { class: 'btn palabra-entera', text: palabra });
      entera.addEventListener('click', function () { resaltar(entera, decir(palabra, 'palabra')); });

      function leerla() { return leerPorSilabas(palabra, nodos, entera); }

      marco([
        el('div', { class: 'palabra-tarjeta' }, [
          el('div', { class: 'palabra-emoji', text: emoji }),
          fila,
          entera,
          el('p', { class: 'dato', text: (i + 1) + ' / ' + lista.length })
        ]),
        el('div', { class: 'fila-botones' }, [
          el('button', { class: 'btn btn-audio', text: '🔊 ' + T.t('otraVez'), onclick: leerla }),
          el('button', {
            class: 'btn btn-principal',
            text: '➡️ ' + T.t('siguiente'),
            onclick: function () { Voz.parar(); i++; ver(); }
          })
        ])
      ], 'pasoPalabras', T.t('tocaParaOir'), leerla);
    }
    ver();
  }

  /* --- 5. Construir la palabra que has oído ---------------------------- */

  function pasoConstruir() {
    var u = leccion.unidad;
    var lista = mezclar(u.palabras.slice()).slice(0, 4);
    var i = 0;

    function ronda() {
      if (i >= lista.length) return siguientePaso();
      var palabra = lista[i][0];
      var emoji = lista[i][1];
      var trozos = Silabas.syllabify(palabra);
      var puestas = 0;

      var hueco = el('div', { class: 'construccion' });
      var banco = el('div', { class: 'rejilla-silabas' });

      /* Sílabas de la palabra + un par de señuelos de la misma unidad. */
      var senuelos = tomar(u.silabas || [], Math.min(2, Math.max(0, 5 - trozos.length)), trozos);
      var fichas = mezclar(trozos.concat(senuelos));

      fichas.forEach(function (s) {
        var b = el('button', { class: 'silaba', text: s });
        b.addEventListener('click', function () {
          if (b.disabled) return;
          if (s === trozos[puestas]) {
            b.disabled = true;
            b.classList.add('bien');
            hueco.appendChild(el('span', { class: 'hueco', text: s }));
            puestas++;
            decir(s, 'silaba');
            if (puestas === trozos.length) {
              confeti();
              setTimeout(function () {
                Voz.secuencia([
                  { text: '¡Muy bien!', tipo: 'frase', pausa: 250 },
                  { text: palabra, tipo: 'palabra' }
                ]);
              }, 400);
              i++;
              setTimeout(ronda, 2200);
            }
          } else {
            b.classList.add('mal');
            setTimeout(function () { b.classList.remove('mal'); }, 500);
            leerPorSilabas(palabra);
          }
        });
        banco.appendChild(b);
      });

      function escuchar() { return leerPorSilabas(palabra); }

      marco([
        el('div', { class: 'tarjeta' }, [
          el('div', { class: 'palabra-emoji', text: emoji }),
          el('button', {
            class: 'btn btn-principal', text: '🔊 ' + T.t('escuchar'), onclick: escuchar
          }),
          el('p', { class: 'dato', text: (i + 1) + ' / ' + lista.length })
        ]),
        hueco,
        banco
      ], 'pasoConstruir', T.t('tocaSilabas'), escuchar);
    }
    ronda();
  }

  /* --- 6. Lee la palabra y elige el dibujo ----------------------------- */
  /*  Sin audio de partida: aquí hay que leer de verdad.                   */

  function pasoEligeDibujo() {
    var u = leccion.unidad;
    var banco = u.palabras.slice();
    var lista = mezclar(banco).slice(0, Math.min(5, banco.length));
    var i = 0;

    function ronda() {
      if (i >= lista.length) return siguientePaso();
      var par = lista[i];
      var palabra = par[0];
      var otras = mezclar(banco.filter(function (p) { return p[1] !== par[1]; })).slice(0, 2);
      var opciones = mezclar([par].concat(otras));

      var rejilla = el('div', { class: 'rejilla-silabas' });
      opciones.forEach(function (o) {
        var b = el('button', { class: 'silaba', style: 'font-size:2.6rem', text: o[1] });
        b.addEventListener('click', function () {
          if (o[0] === palabra) {
            b.classList.add('bien');
            decir('¡Sí! ' + palabra, 'frase');
            i++;
            setTimeout(ronda, 1400);
          } else {
            b.classList.add('mal');
            setTimeout(function () { b.classList.remove('mal'); }, 500);
            narrar('Ese no. Lee otra vez.');
          }
        });
        rejilla.appendChild(b);
      });

      marco([
        el('div', { class: 'tarjeta' }, [
          el('div', { class: 'palabra-entera', text: palabra }),
          el('button', {
            class: 'btn', text: '🔊 ' + T.t('escuchar'),
            onclick: function () { leerPorSilabas(palabra); }
          }),
          el('p', { class: 'dato', text: (i + 1) + ' / ' + lista.length })
        ]),
        rejilla
      ], 'pasoQuizPal', 'Lee la palabra y toca el dibujo');
    }
    ronda();
  }


  /* ------------------------------------------------ leer en voz alta ---- */

  function estrellasTexto(n) {
    n = Math.max(0, Math.min(3, n));
    return new Array(n + 1).join('★') + new Array(3 - n + 1).join('☆');
  }

  function micDisponible() {
    return Escucha.soportado && Escucha.contextoSeguro() && Progreso.ajuste('micro') !== false;
  }

  /*
   * Bloque de lectura en voz alta: el niño toca el micrófono, lee, y ve qué
   * palabras le han salido bien. Sirve igual para una palabra suelta, una
   * frase o una línea de un cuento.
   *
   * Dos decisiones importantes:
   *   - Aquí la app NO lee el texto antes. Si lo hiciera, bastaría con repetir
   *     de oído y no haría falta leer, que es justo lo que se quiere medir.
   *     El botón 🔊 está ahí para cuando se atasca, no antes de intentarlo.
   *   - Todo veredicto se dice en voz alta: no puede leer su propia corrección.
   */
  function bloqueMicro(objetivo, opciones) {
    opciones = opciones || {};
    var caja = el('div', { class: 'micro' });

    function vaciar() { caja.innerHTML = ''; }

    function botonMicro(clase) {
      return el('button', {
        class: 'micro-btn' + (clase ? ' ' + clase : ''),
        'aria-label': T.t('tocaYLee')
      }, [el('span', { class: 'micro-icono', text: '🎤' })]);
    }

    function leerObjetivo() {
      return opciones.silabas === false
        ? decir(objetivo, 'frase')
        : leerPorSilabas(objetivo, opciones.nodos);
    }

    function reposo(aviso) {
      vaciar();
      var boton = botonMicro();
      boton.addEventListener('click', empezar);
      caja.appendChild(boton);
      caja.appendChild(el('p', { class: 'micro-pie' }, etiqueta('tocaYLee')));
      caja.appendChild(el('div', { class: 'fila-botones' }, [
        el('button', { class: 'btn', text: '🔊 ' + T.t('escuchalo'), onclick: leerObjetivo }),
        opciones.alAcabar ? el('button', {
          class: 'btn', text: '⏭️ ' + T.t('saltar'),
          onclick: function () { opciones.alAcabar(null); }
        }) : null
      ]));
      if (aviso) caja.appendChild(el('p', { class: 'micro-error', text: aviso }));
    }

    function empezar() {
      Voz.parar();     // callar primero: si no, la app se oye a sí misma
      vaciar();
      caja.appendChild(botonMicro('escuchando'));
      caja.appendChild(el('p', { class: 'micro-pie' }, etiqueta('teEscucho')));
      var eco = el('p', { class: 'transcripcion', text: '' });
      caja.appendChild(eco);

      Escucha.escuchar({
        maxMs: objetivo.length > 26 ? 15000 : 9000,
        onParcial: function (t) { eco.textContent = t; }
      }).then(function (r) {
        if (!r.ok) {
          var m = Escucha.mensaje(r.error);
          reposo(m);
          narrar(m);
          return;
        }
        mostrar(Evaluar.puntuar(objetivo, r.textos));
      });
    }

    function mostrar(res) {
      vaciar();

      var marcada = el('p', { class: 'lectura-marcada' });
      res.palabras.forEach(function (p, i) {
        if (i) marcada.appendChild(document.createTextNode(' '));
        marcada.appendChild(el('span', { class: 'pal-' + p.estado, text: p.texto }));
      });

      var base = Evaluar.animo(res.estrellas) + (res.pista ? ' ' + res.pista.texto : '');
      var comentario = el('p', { class: 'comentario', text: base });

      caja.appendChild(el('div', { class: 'veredicto v' + res.estrellas }, [
        el('div', { class: 'estrellas-ganadas', text: estrellasTexto(res.estrellas) }),
        marcada,
        res.oido ? el('p', { class: 'oido', text: T.t('heOido') + ': «' + res.oido + '»' }) : null,
        comentario
      ]));

      caja.appendChild(el('div', { class: 'fila-botones' }, [
        el('button', { class: 'btn btn-audio', text: '🔊 ' + T.t('escuchalo'), onclick: leerObjetivo }),
        el('button', { class: 'btn', text: '🎤 ' + T.t('otraVez'), onclick: empezar }),
        opciones.alAcabar ? el('button', {
          class: 'btn btn-principal', text: '➡️ ' + T.t('siguiente'),
          onclick: function () { opciones.alAcabar(res); }
        }) : null
      ]));

      /*
       * Si el navegador trae modelo propio, le damos una ventana corta para
       * mejorar el comentario. Se dice en voz alta lo mismo que se muestra,
       * venga de donde venga: el niño no puede leerlo por su cuenta.
       */
      Promise.race([
        Modelo.comentar({ objetivo: objetivo, oido: res.oido, nota: res.nota,
                          pista: res.pista ? res.pista.texto : '' }),
        new Promise(function (r) { setTimeout(function () { r(null); }, 1400); })
      ]).then(function (delModelo) {
        var texto = base;
        if (delModelo && caja.contains(comentario)) {
          texto = delModelo;
          comentario.textContent = delModelo;
          comentario.appendChild(el('span', { class: 'sello-modelo', text: ' ✨' }));
        }
        return narrar(texto);
      }).then(function () {
        if (res.estrellas < 2) return leerObjetivo();
      });
    }

    reposo(null);
    return caja;
  }

  /* --- 7. Léelo tú y compruébate --------------------------------------- */

  function pasoLeerTu() {
    var u = leccion.unidad;
    var lista = mezclar(u.palabras.slice()).slice(0, 4);
    var i = 0;

    function ronda() {
      if (i >= lista.length) return siguientePaso();
      var palabra = lista[i][0];
      var emoji = lista[i][1];
      var trozos = Silabas.syllabify(palabra);

      var fila = el('div', { class: 'palabra-silabas' });
      var nodos = [];
      trozos.forEach(function (s) {
        var n = el('span', { class: 'trozo', text: s });
        nodos.push(n);
        fila.appendChild(n);
      });

      /* Con micrófono, la app escucha y puntúa; sin él, se autoevalúa. */
      if (micDisponible()) {
        marco([
          el('div', { class: 'palabra-tarjeta' }, [
            el('div', { class: 'palabra-emoji', text: emoji }),
            fila,
            el('p', { class: 'dato', text: (i + 1) + ' / ' + lista.length })
          ]),
          bloqueMicro(palabra, {
            nodos: nodos,
            alAcabar: function () { i++; ronda(); }
          })
        ], 'pasoLeerVoz', T.t('tocaYLee'));
        return;
      }

      var comprobado = false;
      var acciones = el('div', { class: 'fila-botones' });

      function mostrarValoracion() {
        acciones.innerHTML = '';
        acciones.appendChild(el('button', {
          class: 'btn btn-principal',
          text: '😀 ' + T.t('loDijeBien'),
          onclick: function () { i++; ronda(); }
        }));
        acciones.appendChild(el('button', {
          class: 'btn',
          text: '🔁 ' + T.t('otraVezLeer'),
          onclick: function () { leerPorSilabas(palabra, nodos); }
        }));
      }

      acciones.appendChild(el('button', {
        class: 'btn btn-principal btn-grande',
        text: '🔊 ' + T.t('comprobar'),
        onclick: function () {
          leerPorSilabas(palabra, nodos).then(function () {
            if (!comprobado) { comprobado = true; mostrarValoracion(); }
          });
        }
      }));

      marco([
        el('div', { class: 'palabra-tarjeta' }, [
          el('div', { class: 'palabra-emoji', text: emoji }),
          fila,
          el('p', { class: 'dato', text: (i + 1) + ' / ' + lista.length })
        ]),
        acciones
      ], 'pasoLeerTu', T.t('ahoraLeeTu'));
    }
    ronda();
  }

  /* --- 8. Frases y textos ---------------------------------------------- */

  /* Convierte una frase en palabras y sílabas que se pueden tocar. */
  function frasePintada(texto, separar) {
    var caja = el('div', { class: 'frase' });
    var palabras = [];
    Silabas.tokenize(texto).forEach(function (tok) {
      if (tok.type !== 'word') {
        caja.appendChild(document.createTextNode(tok.text));
        return;
      }
      var span = el('span', { class: 'palabra-tocable' });
      if (separar) {
        tok.syllables.forEach(function (s, k) {
          var sil = el('span', { class: 'sil ' + (k % 2 ? 'sil-b' : 'sil-a'), text: s });
          sil.addEventListener('click', function (ev) {
            ev.stopPropagation();
            resaltar(sil, decir(s, 'silaba'));
          });
          span.appendChild(sil);
          if (k < tok.syllables.length - 1) span.appendChild(el('span', { class: 'sep', text: '·' }));
        });
      } else {
        span.textContent = tok.text;
      }
      span.addEventListener('click', function () { resaltar(span, decir(tok.text, 'palabra')); });
      caja.appendChild(span);
      palabras.push({ nodo: span, texto: tok.text });
    });
    return { caja: caja, palabras: palabras };
  }

  function leerFrase(pintada, texto) {
    return Voz.secuencia(pintada.palabras.map(function (p) {
      return {
        text: p.texto, tipo: 'frase', pausa: 90,
        antes: function () { p.nodo.classList.add('sonando'); },
        despues: function () { p.nodo.classList.remove('sonando'); }
      };
    })).then(function () { return decir(texto, 'frase'); });
  }

  function pasoFrases() {
    var u = leccion.unidad;
    var lista = u.frases.slice();
    var i = 0;
    var separar = true;

    function ver() {
      if (i >= lista.length) return siguientePaso();
      var texto = lista[i];
      var pintada = frasePintada(texto, separar);
      var zonaMicro = el('div', {});

      marco([
        pintada.caja,
        el('div', { class: 'fila-botones' }, [
          el('button', {
            class: 'btn btn-audio', text: '🔊 ' + T.t('escuchar'),
            onclick: function () { leerFrase(pintada, texto); }
          }),
          el('button', {
            class: 'btn', text: separar ? '🔗 ' + T.t('verJunto') : '✂️ ' + T.t('verSilabas'),
            onclick: function () { separar = !separar; ver(); }
          }),
          micDisponible() ? el('button', {
            class: 'btn', text: '🎤 ' + T.t('leerlaTu'),
            onclick: function (ev) {
              Voz.parar();
              ev.currentTarget.disabled = true;
              zonaMicro.innerHTML = '';
              zonaMicro.appendChild(bloqueMicro(texto, { silabas: false }));
              zonaMicro.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
          }) : null,
          el('button', {
            class: 'btn btn-principal',
            text: '➡️ ' + T.t('siguiente'),
            onclick: function () { Voz.parar(); i++; ver(); }
          })
        ]),
        zonaMicro,
        el('p', { class: 'dato', style: 'text-align:center', text: (i + 1) + ' / ' + lista.length })
      ], 'pasoFrases', T.t('tocaPalabra'));
    }
    ver();
  }

  function pasoTexto() {
    var u = leccion.unidad;
    var lista = u.textos;
    var i = 0;

    function ver() {
      if (i >= lista.length) return siguientePaso();
      var cuento = lista[i];
      var pintadas = cuento.lineas.map(function (linea) { return frasePintada(linea, false); });

      var caja = el('div', {});
      caja.appendChild(el('div', { class: 'palabra-emoji', style: 'text-align:center', text: cuento.emoji }));
      caja.appendChild(el('h2', { style: 'text-align:center', text: cuento.titulo }));
      pintadas.forEach(function (p) { caja.appendChild(p.caja); });

      function leerTodo() {
        var k = 0;
        function siguiente() {
          if (k >= pintadas.length) return Promise.resolve();
          var p = pintadas[k];
          var linea = cuento.lineas[k];
          k++;
          return leerFrase(p, linea).then(function () {
            return new Promise(function (r) { setTimeout(r, 400); });
          }).then(siguiente);
        }
        return siguiente();
      }

      marco([
        caja,
        el('div', { class: 'fila-botones' }, [
          el('button', { class: 'btn btn-audio', text: '🔊 ' + T.t('escuchar'), onclick: leerTodo }),
          micDisponible() ? el('button', {
            class: 'btn', text: '🎤 ' + T.t('leerlaTu'),
            onclick: function () { Voz.parar(); porLineas(cuento, 0); }
          }) : null,
          el('button', {
            class: 'btn btn-principal',
            text: '➡️ ' + T.t('siguiente'),
            onclick: function () { Voz.parar(); i++; ver(); }
          })
        ])
      ], 'pasoTexto', T.t('tocaPalabra'));
    }

    /*
     * Leer el cuento entero de una vez es demasiado para quien empieza, y el
     * reconocedor corta en la primera pausa. Se lee línea a línea.
     */
    function porLineas(cuento, k) {
      if (k >= cuento.lineas.length) return ver();
      var linea = cuento.lineas[k];
      var pintada = frasePintada(linea, false);

      marco([
        el('p', { class: 'dato', style: 'text-align:center',
                  text: cuento.emoji + '  ' + (k + 1) + ' / ' + cuento.lineas.length }),
        pintada.caja,
        bloqueMicro(linea, {
          silabas: false,
          alAcabar: function () { porLineas(cuento, k + 1); }
        })
      ], 'pasoLeerVoz', T.t('tocaYLee'));
    }

    ver();
  }

  /* ---------------------------------------------------- lector libre ---- */

  function verLector() {
    vista = { nombre: 'lector' };
    var guardado = '';
    try { guardado = global.localStorage.getItem('lectura-es-texto') || ''; } catch (e) {}

    var area = el('textarea', {
      placeholder: T.t('escribeAlgo'),
      spellcheck: 'false',
      'aria-label': T.t('escribeAlgo')
    });
    area.value = guardado || 'El pingüino pequeño come chocolate con fresas.';

    var salida = el('div', { class: 'salida' });
    var separar = true;
    var pintadas = [];

    function repintar() {
      salida.innerHTML = '';
      pintadas = [];
      var texto = area.value;
      try { global.localStorage.setItem('lectura-es-texto', texto); } catch (e) {}

      Silabas.tokenize(texto).forEach(function (tok) {
        if (tok.type !== 'word') {
          salida.appendChild(document.createTextNode(tok.text));
          return;
        }
        var pal = el('span', { class: 'pal palabra-tocable' });
        if (separar) {
          tok.syllables.forEach(function (s, k) {
            var sil = el('span', { class: 'sil ' + (k % 2 ? 'sil-b' : 'sil-a'), text: s });
            sil.addEventListener('click', function (ev) {
              ev.stopPropagation();
              resaltar(sil, decir(s, 'silaba'));
            });
            pal.appendChild(sil);
            if (k < tok.syllables.length - 1) pal.appendChild(el('span', { class: 'sep', text: '·' }));
          });
        } else {
          pal.textContent = tok.text;
        }
        pal.addEventListener('click', function () { resaltar(pal, decir(tok.text, 'palabra')); });
        salida.appendChild(pal);
        pintadas.push({ nodo: pal, texto: tok.text });
      });
    }

    /* Leer en voz alta lo que él mismo ha escrito o pegado. */
    var zonaMicro = el('div', {});
    function prepararMicro() {
      zonaMicro.innerHTML = '';
      if (!micDisponible()) return;
      var texto = area.value.trim();
      if (!texto) return;
      zonaMicro.appendChild(el('div', { class: 'enunciado' }, [
        el('button', {
          class: 'btn btn-icono btn-audio', text: '🎤',
          onclick: function (ev) {
            ev.currentTarget.disabled = true;
            zonaMicro.appendChild(bloqueMicro(texto, { silabas: false }));
          }
        }),
        el('div', { class: 'txt' }, etiqueta('leerlaTu'))
      ]));
    }

    area.addEventListener('input', function () { repintar(); prepararMicro(); });
    repintar();
    prepararMicro();

    pintar([
      barra(T.t('lectorLibre'), verPortada),
      el('section', { class: 'lector' }, [
        el('div', { class: 'enunciado' }, [
          el('button', {
            class: 'btn btn-icono btn-audio', text: '🔊',
            onclick: function () { narrar(T.t('tocaPalabra')); }
          }),
          el('div', { class: 'txt' }, etiqueta('tocaPalabra'))
        ]),
        area,
        el('div', { class: 'fila-botones' }, [
          el('button', {
            class: 'btn btn-principal', text: '🔊 ' + T.t('leerTodo'),
            onclick: function () {
              Voz.secuencia(pintadas.map(function (p) {
                return {
                  text: p.texto, tipo: 'frase', pausa: 110,
                  antes: function () { p.nodo.classList.add('sonando'); },
                  despues: function () { p.nodo.classList.remove('sonando'); }
                };
              }));
            }
          }),
          el('button', {
            class: 'btn',
            text: separar ? '🔗 ' + T.t('verJunto') : '✂️ ' + T.t('verSilabas'),
            onclick: function (ev) {
              separar = !separar;
              ev.currentTarget.textContent = separar ? '🔗 ' + T.t('verJunto') : '✂️ ' + T.t('verSilabas');
              repintar();
            }
          }),
          el('button', {
            class: 'btn', text: '🧹 ' + T.t('limpiar'),
            onclick: function () { Voz.parar(); area.value = ''; repintar(); area.focus(); }
          })
        ]),
        salida,
        zonaMicro
      ])
    ]);
  }

  /* ------------------------------------------------------ instalar ----- */

  /*
   * Instalar la app. Si el navegador ofrece su propio diálogo, con un toque
   * basta. Si no, explicamos los pasos exactos de ESTE navegador: los sitios
   * que dicen "añádelo a tu pantalla de inicio" sin más no ayudan a nadie.
   */
  function verInstalar() {
    var hoja = el('div', { class: 'hoja' });
    hoja.addEventListener('click', function (e) { if (e.target === hoja) hoja.remove(); });
    var panel = el('div', { class: 'hoja-panel' });

    var caso = PWA.situacion();

    panel.appendChild(el('div', { style: 'text-align:center' }, [
      el('div', { style: 'font-size:3.4rem;line-height:1', text: '📲' }),
      el('h2', { style: 'margin:6px 0 2px' }, etiqueta('instalarApp')),
      el('p', { class: 'dato', text: 'Un icono propio, ventana propia, y sin buscar el archivo.' })
    ]));

    if (caso.clave === 'listo') {
      panel.appendChild(el('div', { class: 'ajuste' }, [
        el('button', {
          class: 'btn btn-principal btn-grande',
          text: '📲 ' + T.t('instalar'),
          onclick: function (ev) {
            ev.currentTarget.disabled = true;
            PWA.instalar().then(function (ok) {
              hoja.remove();
              if (ok) { confeti(); narrar('¡Ya está instalada!'); }
              verPortada();
            });
          }
        })
      ]));
    } else if (caso.clave === 'ya') {
      panel.appendChild(el('p', { class: 'truco' }, etiqueta('yaInstalada')));
    } else {
      var ayuda = el('div', { class: 'ajuste' }, [el('label', {}, etiqueta('instalarComo'))]);
      if (caso.nota) ayuda.appendChild(el('p', { class: 'nota-instalar', text: caso.nota }));
      /* Numerado sólo si de verdad hay un orden; con viñeta si son alternativas. */
      if (caso.pasos) {
        ayuda.appendChild(el('ol', { class: 'pasos-instalar' }, caso.pasos.map(function (t) {
          return el('li', { text: t });
        })));
      }
      if (caso.opciones) {
        ayuda.appendChild(el('ul', { class: 'pasos-instalar opciones' }, caso.opciones.map(function (t) {
          return el('li', { text: t });
        })));
      }
      panel.appendChild(ayuda);
    }

    if (PWA.sinConexion()) {
      panel.appendChild(el('p', { class: 'dato', text: '✅ ' + T.t('sinConexion') }));
    }

    panel.appendChild(el('div', { class: 'ajuste' }, [
      el('button', {
        class: 'btn btn-grande', text: T.t('entendido'),
        onclick: function () { hoja.remove(); }
      })
    ]));

    hoja.appendChild(panel);
    document.body.appendChild(hoja);
  }

  /* -------------------------------------------------------- ajustes ---- */

  function verAjustes() {
    var hoja = el('div', { class: 'hoja' });
    hoja.addEventListener('click', function (e) { if (e.target === hoja) hoja.remove(); });

    var panel = el('div', { class: 'hoja-panel' });

    /* Velocidad */
    var vel = el('input', {
      type: 'range', min: '0.5', max: '1.3', step: '0.05',
      value: String(Progreso.ajuste('velocidad'))
    });
    vel.addEventListener('input', function () {
      var v = parseFloat(vel.value);
      Progreso.ajuste('velocidad', v);
      Voz.velocidad(v);
    });
    vel.addEventListener('change', function () { decir('ma me mi mo mu', 'silaba'); });

    /* Voz */
    var selector = el('select');
    function rellenarVoces() {
      selector.innerHTML = '';
      var actual = Voz.vozActual();
      Voz.voces().forEach(function (v) {
        selector.appendChild(el('option', {
          value: v.voiceURI,
          selected: actual && v.voiceURI === actual.voiceURI ? 'selected' : null,
          text: v.name + ' (' + v.lang + ')'
        }));
      });
      if (!Voz.voces().length) selector.appendChild(el('option', { text: '—' }));
    }
    rellenarVoces();
    Voz.alCargarVoces(rellenarVoces);
    selector.addEventListener('change', function () {
      Voz.elegirVoz(selector.value);
      Progreso.ajuste('voz', selector.value);
      decir('Hola, vamos a leer', 'frase');
    });

    function interruptor(clave, valorInicial, alCambiar) {
      var input = el('input', { type: 'checkbox', checked: valorInicial ? 'checked' : null });
      input.addEventListener('change', function () { alCambiar(input.checked); });
      return el('div', { class: 'ajuste' }, [
        el('label', { class: 'interruptor' }, [
          el('span', {}, etiqueta(clave)),
          input
        ])
      ]);
    }

    panel.appendChild(el('div', { class: 'ajuste' }, [
      el('label', {}, etiqueta('velocidad')),
      vel,
      el('div', {
        style: 'display:flex;justify-content:space-between;font-weight:700;color:var(--tinta-suave)'
      }, [el('span', { text: '🐢 ' + T.t('lento') }), el('span', { text: T.t('rapido') + ' 🐇' })])
    ]));

    panel.appendChild(el('div', { class: 'ajuste' }, [
      el('label', {}, etiqueta('voz')), selector
    ]));

    panel.appendChild(interruptor('mostrarChino', T.usarChino(), function (v) {
      T.usarChino(v);
      Progreso.ajuste('chino', v);
      hoja.remove();
      verPortada();
      verAjustes();          // se reabre traducido, sin perder el sitio
    }));

    if (Escucha.soportado) {
      panel.appendChild(interruptor('usarMicro', Progreso.ajuste('micro') !== false, function (v) {
        Progreso.ajuste('micro', v);
      }));
      if (!Escucha.contextoSeguro()) {
        panel.appendChild(el('div', { class: 'aviso' }, [
          el('span', { text: '⚠️' }), el('span', { text: T.t('sinSeguro') })
        ]));
      }
    } else {
      panel.appendChild(el('div', { class: 'ajuste' }, [
        el('label', {}, etiqueta('micro')),
        el('p', { class: 'dato', text: T.t('microNo') })
      ]));
    }

    /* Estado del modelo integrado del navegador, que es opcional. */
    var estadoModelo = el('p', { class: 'dato', text: '…' });
    Modelo.comprobar().then(function (e) {
      estadoModelo.textContent =
        e === 'listo' ? '✅ ' + T.t('modeloListo')
        : e === 'descargable' ? '⬇️ ' + T.t('modeloDescarga')
        : '— ' + T.t('modeloNo');
    });
    panel.appendChild(el('div', { class: 'ajuste' }, [
      el('label', {}, etiqueta('modeloTitulo')),
      estadoModelo
    ]));

    panel.appendChild(interruptor('mayusculas', Progreso.ajuste('mayusculas'), function (v) {
      Progreso.ajuste('mayusculas', v);
      document.body.setAttribute('data-may', v ? '1' : '0');
    }));

    panel.appendChild(interruptor('desbloquear', Progreso.ajuste('desbloquearTodo'), function (v) {
      Progreso.ajuste('desbloquearTodo', v);
    }));

    panel.appendChild(el('div', { class: 'ajuste' }, [
      el('button', {
        class: 'btn btn-grande',
        style: 'border-color:var(--error);color:var(--error)',
        text: '🗑️ ' + T.t('borrar'),
        onclick: function () {
          if (global.confirm(T.t('borrarSeguro'))) {
            Progreso.reiniciar();
            hoja.remove();
            verPortada();
          }
        }
      })
    ]));

    panel.appendChild(el('div', { class: 'ajuste' }, [
      el('button', { class: 'btn btn-principal btn-grande', text: T.t('cerrar'), onclick: function () { hoja.remove(); } })
    ]));

    hoja.appendChild(panel);
    document.body.appendChild(hoja);
  }

  /* ---------------------------------------------------------- arranque -- */

  function iniciar() {
    raiz = document.getElementById('app');

    var a = Progreso.datos().ajustes;
    Voz.velocidad(a.velocidad || 0.85);
    T.usarChino(!!a.chino);
    document.body.setAttribute('data-may', a.mayusculas ? '1' : '0');
    if (a.voz) Voz.alCargarVoces(function () { Voz.elegirVoz(a.voz); });

    /* El primer toque desbloquea la voz en iOS y Android. */
    var desbloquear = function () {
      Voz.preparar();
      document.removeEventListener('pointerdown', desbloquear);
      document.removeEventListener('keydown', desbloquear);
    };
    document.addEventListener('pointerdown', desbloquear);
    document.addEventListener('keydown', desbloquear);

    /* Al salir de la página, callar. */
    global.addEventListener('pagehide', function () { Voz.parar(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) Voz.parar();
    });

    /* Atajo del icono de la app (manifest → shortcuts): abre el lector. */
    if (location.hash === '#lector') verLector();
    else verPortada();

    /* Si el navegador ofrece instalar más tarde, refrescamos la portada. */
    PWA.alCambiar(function () { if (vista.nombre === 'portada') verPortada(); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})(window);

</script>
</body>
</html>
